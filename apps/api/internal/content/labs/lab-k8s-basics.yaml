# Kubernetes 기초 — 임시 Lab DSL (정식 스키마 확정 전까지 사용).
# checks[] 필드는 검증엔진(apps/validation-engine)의 Check 스키마와 정렬되어 있어
# 실제 검증엔진 연동 시 그대로 publish 가능하다.
# checks[].command 는 검증엔진의 command 화이트리스트(영숫자/공백/ /._-=:@%"')만 사용한다.
# hint_levels: 레벨 1(개념) → 2(방향) → 3(구체). AI 도우미 미가용 시의 정적 폴백.
id: lab-k8s-basics
title: Kubernetes 기초
description: Pod, Deployment, Service 기본 개념 실습
difficulty: beginner
duration_min: 60
vm_type: lab-small
# k3s-in-VM 환경 — 아직 미구현이라 실시간 터미널 비활성(콘텐츠 전용).
environment: k3s
tags:
  - kubernetes
  - pod
  - deployment
steps:
  - id: 1
    title: Pod 생성
    description: >
      nginx 이미지로 단일 Pod를 생성합니다. Pod는 쿠버네티스에서 배포 가능한
      가장 작은 단위로, 하나 이상의 컨테이너를 감쌉니다.
    commands:
      - kubectl run nginx --image=nginx --restart=Never
    hint: "kubectl run <이름> --image=<이미지> 형태입니다. --restart=Never 로 단일 Pod가 생성됩니다."
    hint_levels:
      - "Deployment 없이 Pod 하나만 바로 만드는 kubectl 명령이 있습니다. 어떤 동사를 쓸까요?"
      - "kubectl run 명령으로 Pod를 만들 수 있습니다. 이미지 지정 옵션과, ReplicaSet 없이 단일 Pod로 만들기 위한 restart 정책 옵션이 필요합니다."
      - "kubectl run <이름> --image=<이미지> --restart=Never 형태입니다. 이름은 nginx, 이미지도 nginx 입니다."
    checks:
      - type: command
        command: kubectl get pods
        expect: nginx
  - id: 2
    title: Deployment 생성
    description: >
      replica 3개를 유지하는 Deployment를 생성합니다. Deployment는 ReplicaSet을
      통해 원하는 수의 Pod를 선언적으로 관리하며, 장애 시 자동으로 복구합니다.
    commands:
      - kubectl create deployment web --image=nginx --replicas=3
    hint: "kubectl create deployment <이름> --image=<이미지> --replicas=3"
    hint_levels:
      - "여러 개의 Pod 복제본을 선언적으로 유지하려면 Pod가 아니라 어떤 리소스를 만들어야 할까요?"
      - "kubectl create deployment 명령을 사용합니다. 이미지와 복제본 수를 지정하는 옵션이 각각 있습니다."
      - "kubectl create deployment <이름> --image=<이미지> --replicas=<수> 형태입니다. 이름은 web, 복제본은 3개입니다."
    checks:
      - type: command
        command: kubectl get deployment web
        expect: web
  - id: 3
    title: Service 노출
    description: >
      Deployment를 ClusterIP Service로 노출해 클러스터 내부에서 안정적인
      엔드포인트(서비스명:포트)로 Pod 집합에 접근할 수 있게 합니다.
    commands:
      - kubectl expose deployment web --port=80 --target-port=80
    hint: "kubectl expose deployment <이름> --port=<포트> 로 Service를 만듭니다."
    hint_levels:
      - "Pod IP는 재생성될 때마다 바뀝니다. Pod 집합 앞에 고정된 접근 지점을 만들어 주는 쿠버네티스 리소스는 무엇일까요?"
      - "kubectl expose 명령으로 기존 Deployment 를 Service 로 노출할 수 있습니다. 포트 지정 옵션이 필요합니다."
      - "kubectl expose deployment <이름> --port=<포트> --target-port=<포트> 형태입니다. 대상은 web, 포트는 80 입니다."
    checks:
      - type: command
        command: kubectl get service web
        expect: web
