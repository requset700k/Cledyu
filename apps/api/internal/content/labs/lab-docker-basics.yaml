# Docker 기초 — 컨테이너 실행·exec·이미지 빌드·수명주기 인터랙티브 랩.
# init: apt docker.io 설치 + lab 사용자 docker 그룹 등록.
# 소켓 666 은 일회용 격리 VM 전용 편의 설정 — autologin 터미널 세션은 부팅 시점에
# 이미 열려 있어 그룹 추가가 반영되지 않기 때문(검증엔진 ssh 세션은 그룹으로 동작).
id: lab-docker-basics
title: Docker 기초
description: 컨테이너 실행과 exec, Dockerfile 빌드, 수명주기 관리까지 컨테이너 핵심기 실습
difficulty: beginner
duration_min: 60
vm_type: lab-small
environment: ubuntu
tags:
  - docker
  - container
  - dockerfile
init:
  # docker 는 베이스 이미지(lab-base)에 이미 설치돼 있다(서비스만 꺼둠). 여기서 기동 후
  # lab 사용자 docker 그룹·소켓 권한을 설정한다(다운로드 0 → 세션 부팅 단축).
  runcmd:
    - systemctl enable --now docker
    - usermod -aG docker lab
    - chmod 666 /var/run/docker.sock
steps:
  - id: 1
    title: 컨테이너 실행
    description: >
      nginx 이미지를 받아 web 이라는 이름의 컨테이너를 백그라운드(-d)로 실행하고,
      호스트 8080 포트를 컨테이너 80 포트에 연결(-p)하세요. docker ps 로 상태를,
      curl 로 응답을 확인합니다.
    commands:
      - docker run -d --name web -p 8080:80 nginx
      - docker ps
      - curl http://localhost:8080
    hint_levels:
      - "이미지를 내려받아 컨테이너로 실행하는 명령 하나면 됩니다. 백그라운드 실행과 포트 연결 옵션이 각각 무엇인지 떠올려 보세요."
      - "docker run 에 -d(백그라운드), --name(이름), -p <호스트포트>:<컨테이너포트> 를 조합합니다."
      - "docker run -d --name web -p 8080:80 nginx 실행 후 curl http://localhost:8080 에서 nginx 페이지가 나오면 성공입니다."
    checks:
      # docker ps + web 부분일치는 web2/webserver 도 매칭돼 이름을 엄격 검증 못 했다.
      # docker inspect 는 이름 정확 매칭(web ≠ web2) + State.Status 로 running 을 확인한다.
      # (lowercase "running" 은 stopped 의 "Running":false 와 안 겹침 → 실행 중일 때만 통과)
      - type: command
        command: docker inspect web
        expect: running
      - type: command
        command: docker inspect web
        expect: nginx
      - type: command
        command: docker port web 80
        expect: ":8080"
      - type: http_response
        url: http://localhost:8080
        expect_code: 200
  - id: 2
    title: 실행 중인 컨테이너 들어가기 (exec)
    description: |
      docker exec 로 web 컨테이너 내부에 들어가 nginx 기본 페이지를 직접 바꿔보세요.
      컨테이너 안의 /usr/share/nginx/html/index.html 내용을 "hello docker" 로 교체하면
      됩니다. 예:

      docker exec web sh -c 'echo "hello docker" > /usr/share/nginx/html/index.html'
    commands:
      - docker exec web sh -c 'echo "hello docker" > /usr/share/nginx/html/index.html'
      - curl http://localhost:8080
    hint_levels:
      - "실행 중인 컨테이너 안에서 명령을 실행하는 docker 하위 명령이 있습니다. nginx 가 서비스하는 정적 파일의 위치도 떠올려 보세요."
      - "docker exec <컨테이너> sh -c '<명령>' 형태로 컨테이너 내부에서 셸 명령을 실행할 수 있습니다. 대상 파일은 /usr/share/nginx/html/index.html 입니다."
      - "docker exec web sh -c 로 index.html 에 hello docker 를 써넣은 뒤 curl http://localhost:8080 출력이 hello docker 면 성공입니다."
    checks:
      - type: command
        command: curl -s http://localhost:8080
        expect: hello docker
  - id: 3
    title: Dockerfile로 이미지 빌드
    description: |
      ~/app 디렉터리에 나만의 이미지를 정의하고 myweb:v1 로 빌드하세요.

      mkdir -p ~/app/html
      echo "built with dockerfile" > ~/app/html/index.html

      ~/app/Dockerfile:
        FROM nginx
        COPY html /usr/share/nginx/html
    commands:
      - mkdir -p ~/app/html
      - echo "built with dockerfile" > ~/app/html/index.html
      - nano ~/app/Dockerfile
      - docker build -t myweb:v1 ~/app
    hint_levels:
      - "이미지는 Dockerfile 의 명령(FROM, COPY...)으로 정의하고 별도 명령으로 빌드합니다. 베이스 이미지 위에 정적 파일만 얹으면 됩니다."
      - "FROM nginx 에 COPY html /usr/share/nginx/html 두 줄이면 충분합니다. docker build 에 -t <이름:태그> 와 컨텍스트 경로를 넘기세요."
      - "Dockerfile 작성 후 docker build -t myweb:v1 ~/app 을 실행하면 docker images 목록에 myweb 이 보입니다."
    checks:
      - type: file_exists
        path: /home/lab/app/Dockerfile
      # Dockerfile 이 nginx 기반인지(내용) 확인 — file_exists 만으론 빈/엉뚱한 파일도 통과한다.
      # "FROM nginx" 부분일치라 FROM nginx:alpine 같은 태그 변형도 수용한다.
      - type: file_content
        path: /home/lab/app/Dockerfile
        expect: FROM nginx
      # myweb:v1 까지 명시해 정확한 태그가 빌드됐는지 확인('docker images'+myweb 는 myweb:v2 등도 통과).
      - type: command
        command: docker images myweb:v1
        expect: myweb
      # COPY 가 제대로 됐는지 '빌드된 이미지 내용'으로 확인한다. Dockerfile 텍스트(COPY ./html
      # 같은 유효 변형)를 검사하면 false fail 위험이 있어, 실제 이미지 웹루트 파일을 직접 본다.
      # 이렇게 하면 step3 의 Dockerfile 오류를 step4 로 미루지 않고 step3 에서 잡는다.
      # --pull=never: 미빌드 상태에서도 RunAll 이 이 체크까지 실행하는데, docker run 기본 pull
      # policy(missing)면 로컬 전용 태그 myweb:v1 을 외부 레지스트리에서 pull 시도해 느려진다.
      # 로컬 빌드 산출물만 검사하고 없으면 즉시 실패하도록 pull 을 막는다.
      - type: command
        command: docker run --rm --pull=never myweb:v1 cat /usr/share/nginx/html/index.html
        expect: built with dockerfile
  - id: 4
    title: 빌드한 이미지 실행
    description: >
      myweb:v1 이미지를 web2 라는 이름으로 8081 포트에 실행하고, curl 로 직접 만든
      페이지(built with dockerfile)가 서비스되는지 확인하세요.
    commands:
      - docker run -d --name web2 -p 8081:80 myweb:v1
      - curl http://localhost:8081
    hint_levels:
      - "1단계와 같은 실행 명령이지만 이번엔 직접 빌드한 이미지와 다른 호스트 포트를 사용합니다."
      - "docker run -d --name web2 -p 8081:80 에 이미지 이름 myweb:v1 을 지정하세요."
      - "docker run -d --name web2 -p 8081:80 myweb:v1 실행 후 curl http://localhost:8081 출력이 built with dockerfile 이면 성공입니다."
    checks:
      # 이미지가 myweb:v1 인지
      - type: command
        command: docker inspect web2
        expect: myweb:v1
      # 컨테이너 80 이 호스트 8081 에 매핑됐는지
      - type: command
        command: docker port web2 80
        expect: ":8081"
      # 실제로 그 페이지를 서비스하는지 결과로 최종 확인
      - type: command
        command: curl -s http://localhost:8081
        expect: built with dockerfile
  - id: 5
    title: 수명주기 관리
    description: >
      docker logs 로 web 컨테이너의 접근 로그를 확인한 뒤, web 컨테이너를 중지하세요.
      중지된 컨테이너는 사라지지 않고 Exited 상태로 남습니다 — docker ps -a 로 전체
      목록을 확인해 보세요. (완전히 지우려면 docker rm 을 씁니다)
    commands:
      - docker logs web
      - docker stop web
      - docker ps -a
    hint_levels:
      - "컨테이너의 stdout 로그를 보는 명령과, 실행을 멈추는 명령을 떠올려 보세요. 멈춘 컨테이너는 어디서 볼 수 있을까요?"
      - "docker logs <이름> / docker stop <이름> 을 사용합니다. docker ps 는 실행 중만, -a 를 붙이면 중지된 것까지 보입니다."
      - "docker stop web 후 docker ps -a 에서 web 이 Exited 상태로 보이면 완료입니다."
    checks:
      # docker ps -a + Exited 는 '아무 컨테이너나 Exited면 통과'라 web 이 멈췄는지 특정 못 했다.
      # docker inspect 는 이름을 정확 매칭(web ≠ web2)하므로 web 상태만 본다. 멈췄으면 State.Status
      # 가 "exited" → 부분일치 통과, 실행 중이면 "running" → 실패. (commands 의 ps -a 교육은 유지)
      - type: command
        command: docker inspect web
        expect: exited
