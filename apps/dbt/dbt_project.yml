name: cledyu_analytics # dbt 프로젝트 이름, models: 블록에서 cledyu_analytics: 키로 참조
version: "1.0.0"
config-version: 2

profile: cledyu # profiles.yml의 cledyu: 블록을 dbt가 보고 BigQuery에 연결

# 각 파일의 종류가 어느 디렉토리에 있는지 dbt에게 알려준다.
# dbt run 실행시 models/ 폴더의 SQL 파일들을 찾아 실제 BigQuery 경로로 치환해 target/ 폴더에 저장하고 BigQuery 실행
model-paths: ["models"] # models/ 폴더를 가리키며 dbt가 그 안에서 SQL 변환 모델 파일들을 찾는다. (staging/, marts/)


seed-paths: ["seeds"] # 코드로 관리해야 하는 작은 참조 데이터(CSV)를 BigQuery 테이블로 올리는 기능
# (이벤트 lab_id: lab_001만 존재하는데 lab_001이 어떤 lab인지는 알 수 없기 때문에 lab_001 = Linux 기초라는 매핑이 존재해야함, 그 매핑을 CSV로 만들어 넣어두는 곳)
macro-paths: ["macros"] #  반복 SQL 로직을 함수처럼 한 곳에 정의해두고 여러 모델에서 호출해서 사용하기 위한 용도 (한 곳만 수정하면 전체 적용)

target-path: "target" # dbt run 실행시 실제 SQL로 변환한 결과물을 로컬에 저장하는데 그 저장하는 경로가 target/
clean-targets: # dbt clean 명령 실행시 지울 디렉터리 목록
  - "target" # 빌드 결과물 폴더
  - "dbt_packages" # dbt deps 명령으로 외부 패키지 설치 시 생기는 폴더

# 모든 모델에 공통으로 적용할 설정
models:
  cledyu_analytics:
    staging:
      +materialized: view # staging 모델들을 BigQuery View로 생성, 쿼리할 때마다 원본 raw 데이터에서 실시간으로 읽는다.
    marts:
      +materialized: table # mart 모델들은 BigQuery Table로 실제 저장, dbt run 시점에 집계를 계산해서 테이블에 써놓는다.
