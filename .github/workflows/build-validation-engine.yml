name: build-validation-engine

# apps/validation-engine 코드가 바뀔 때만 실행 (불필요한 빌드 방지)
on:
  pull_request:
    branches: [main]
    paths:
      - apps/validation-engine/**
      - .github/workflows/build-image.yml
      - .github/workflows/build-validation-engine.yml
  push:
    branches: [main]
    paths:
      - apps/validation-engine/**
      - .github/workflows/build-image.yml
      - .github/workflows/build-validation-engine.yml
  workflow_dispatch: # GitHub UI에서 수동 실행

permissions:
  contents: write # GHCR push + main push 시 build-image.yml 의 bump 잡이 gitops values.yaml 에 push
  packages: write

jobs:
  image:
    # 공통 빌드 워크플로우 재사용 — 빌드, GHCR push, Trivy 스캔, main push 시 gitops tag bump 포함
    uses: ./.github/workflows/build-image.yml
    with:
      context: apps/validation-engine       # Dockerfile이 있는 폴더
      image-name: validation-engine         # ghcr.io/requset700k/validation-engine
      # virtctl(업스트림 KubeVirt 바이너리)의 Go stdlib CVE 를 무시한다 — 패치 불가, 코멘트 참고.
      trivyignores: apps/validation-engine/.trivyignore
      gitops-values-file: gitops/apps/validation-engine/values.yaml
    secrets: inherit
