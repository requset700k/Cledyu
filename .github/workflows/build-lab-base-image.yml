---
# 세션 VM 베이스 이미지 베이킹 — hosted runner 가 AWS OIDC 로 인증해 일회성 EC2 *.metal 을
# 띄우고, metal 이 packer-qemu 로 qcow2 를 구워 ghcr push + (옵션)AMI import 후 self-terminate.
# self-hosted KVM 러너 불필요. 베이크는 hosted runner + 일회성 클라우드 metal 에서만 돌아 fork-PR
# RCE 우려가 없으므로, lab-base/** 변경이 main 에 머지되면 자동 트리거한다(수동 dispatch 도 유지).
# 배포(base-datavolume bump + EC2 ami_id)는 자동화하지 않는다 — 사람이 검증 후 양 provider 함께.
name: build lab base image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그(미입력 시 run id)"
        required: false
        default: ""
      import_ami:
        description: "EC2 AMI 도 함께 import"
        type: boolean
        default: true
      poll_timeout_min:
        description: "sentinel 폴링 최대 대기 시간(분)"
        required: false
        default: "90"
  push:
    branches: [main]
    paths:
      - "infra/images/lab-base/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  BAKER_BUCKET: cledyu-lab-image-baker
  BAKER_INSTANCE_PROFILE: cledyu-lab-baker-instance
  BAKER_ROLE_ARN: arn:aws:iam::504284203153:role/cledyu-lab-gha-baker
  METAL_TYPE: m5.metal
  # Ubuntu 22.04 로 베이크한다. AL2023 는 qemu-system 패키지가 없어 packer-qemu 에 부적합.
  METAL_AMI_SSM: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

concurrency:
  group: build-lab-base-image
  # 진행 중 베이크를 죽이면 launch 된 metal 이 orphan 으로 남아 계속 과금되므로 큐잉한다(취소 금지).
  cancel-in-progress: false

jobs:
  bake:
    name: launch metal baker
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        run: echo "tag=${{ inputs.tag != '' && inputs.tag || format('{0}', github.run_id) }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.BAKER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve metal AMI (Ubuntu 22.04)
        id: ami
        run: |
          AMI=$(aws ssm get-parameter --name "$METAL_AMI_SSM" \
            --query Parameter.Value --output text)
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"

      - name: Launch metal baker
        id: launch
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          # 이전 베이크 metal 이 vCPU 를 반환할 때까지 대기 — 연속 트리거 시 VcpuLimitExceeded·orphan 회피.
          for _w in $(seq 1 40); do
            busy=$(aws ec2 describe-instances \
              --filters "Name=instance-type,Values=$METAL_TYPE" "Name=instance-state-name,Values=pending,running,shutting-down,stopping" \
              --query 'length(Reservations[].Instances[])' --output text)
            [ "$busy" = "0" ] && break
            echo "waiting for metal vcpu to free (busy=$busy)"; sleep 30
          done
          USERDATA=$(cat <<EOF
          #!/usr/bin/env bash
          export REGION=$AWS_REGION TAG=$TAG BAKER_BUCKET=$BAKER_BUCKET IMPORT_AMI=${{ inputs.import_ami || 'true' }} REF=${{ github.sha }}
          curl -fsSL https://raw.githubusercontent.com/requset700k/cledyu/${{ github.sha }}/infra/images/lab-base/baker-bootstrap.sh -o /tmp/b.sh
          bash /tmp/b.sh
          EOF
          )
          IID=$(aws ec2 run-instances --image-id "${{ steps.ami.outputs.ami }}" \
            --instance-type "$METAL_TYPE" \
            --iam-instance-profile "Name=$BAKER_INSTANCE_PROFILE" \
            --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=120,VolumeType=gp3,DeleteOnTermination=true}' \
            --user-data "$USERDATA" \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=cledyu-role,Value=image-baker}]' \
            --instance-initiated-shutdown-behavior terminate \
            --query 'Instances[0].InstanceId' --output text)
          echo "iid=$IID" >> "$GITHUB_OUTPUT"
          echo "launched $IID"

      - name: Poll for completion sentinel
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          MAX=$(( ${{ inputs.poll_timeout_min || '90' }} * 2 ))
          for _i in $(seq 1 "$MAX"); do
            if aws s3 cp "s3://$BAKER_BUCKET/builds/$TAG/done.json" /tmp/done.json 2>/dev/null; then
              echo "### lab-base bake 결과 (배포는 수동: base-datavolume url + EC2 ami_id)" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/done.json >> "$GITHUB_STEP_SUMMARY"
              grep -q '"status":"ok"' /tmp/done.json && exit 0
              echo "baker reported failure" && exit 1
            fi
            sleep 30
          done
          echo "timeout waiting for baker" >&2
          aws ec2 terminate-instances --instance-ids "${{ steps.launch.outputs.iid }}" || true
          exit 1
