---
# 세션 VM 베이스 이미지 베이킹 — Ubuntu 클라우드 이미지에 공통 패키지·qemu-guest-agent 를
# virt-customize 로 미리 굽고 containerDisk(OCI)로 ghcr 에 푸시한다. CDI 가 이 이미지를
# Longhorn base PVC(ubuntu-2204-base)로 import 한다(base-datavolume.yaml).
#
# 실행 환경: KVM 보유 self-hosted runner. GitHub 호스티드 러너는 libguestfs appliance 네트워크
# (passt/slirp)가 불안정해 베이크가 실패하므로 쓰지 않는다(infra/images/lab-base/bake.sh 주석 참고).
#
# 보안: public 레포라 fork PR 코드가 온프렘 self-hosted runner 에서 실행되면 RCE 위험이 있다.
# 따라서 트리거를 workflow_dispatch(메인테이너 수동)만으로 둔다. self-hosted runner 를 등록하기
# 전까지는 이 워크플로가 실행되지 않으며, 베이킹은 호스트에서 스크립트로 수동 수행한다
# (setup-host.sh → docker login ghcr → build-and-push.sh). 러너 등록 후 push 트리거를 검토한다.
name: build lab base image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-lab-base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: bake + push lab base
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host setup (idempotent)
        run: bash infra/images/lab-base/setup-host.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake + build + push containerDisk
        run: bash infra/images/lab-base/build-and-push.sh
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cledyu-lab-base
          TAG: sha-${{ github.sha }}
