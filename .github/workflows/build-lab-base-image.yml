---
# 세션 VM 베이스 이미지 베이킹 — Ubuntu 클라우드 이미지에 공통 패키지·qemu-guest-agent 를
# virt-customize 로 미리 굽고 containerDisk(OCI)로 ghcr 에 푸시한다. CDI 가 이 이미지를
# Longhorn base PVC(ubuntu-2204-base)로 import 한다(base-datavolume.yaml).
name: build lab base image

on:
  pull_request:
    paths:
      - infra/images/lab-base/**
      - .github/workflows/build-lab-base-image.yml
  push:
    branches: [main]
    paths:
      - infra/images/lab-base/**
      - .github/workflows/build-lab-base-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-lab-base-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cledyu-lab-base

jobs:
  build:
    name: bake + push lab base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools
          # passt(libguestfs appliance 기본 네트워크 백엔드)가 GitHub 러너에서 "passt exited with
          # status 1" 로 죽는다. passt 바이너리만 제거하면(패키지 의존성은 건드리지 않음) libguestfs 가
          # 더 안정적인 slirp 네트워크로 폴백한다.
          sudo rm -f "$(command -v passt)" /usr/bin/passt /usr/sbin/passt || true
          # GitHub 러너 커널을 libguestfs appliance 가 읽을 수 있게 한다(알려진 권한 이슈 회피).
          sudo chmod 0644 /boot/vmlinuz-* || true
          # libguestfs 환경 점검(실패 시 원인 조기 노출).
          sudo libguestfs-test-tool --qemu qemu-system-x86_64 >/dev/null 2>&1 || true

      - name: Bake base image (virt-customize)
        run: sudo --preserve-env=LIBGUESTFS_BACKEND,OUT bash infra/images/lab-base/bake.sh
        env:
          LIBGUESTFS_BACKEND: direct
          OUT: infra/images/lab-base/disk/lab-base.qcow2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push containerDisk
        uses: docker/build-push-action@v6
        with:
          context: infra/images/lab-base
          file: infra/images/lab-base/containerdisk.dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
