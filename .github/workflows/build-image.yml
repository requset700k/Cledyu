name: build-image

# Reusable container build/push pipeline.
#
# 호출 패턴 (caller workflow):
#   jobs:
#     build:
#       uses: ./.github/workflows/build-image.yml
#       with:
#         context: apps/<service>
#         image-name: <service>
#       permissions:
#         contents: read
#         packages: write
#       secrets: inherit
#
# 빌드 정책:
#   - PR             : build only (push X, scan X). 빌드 가능성 검증.
#   - main push      : build + push + Trivy scan (HIGH/CRITICAL fail).
#   - workflow_dispatch: push + scan (수동 재발행용).
#
# 태그:
#   - sha-<short>     : immutable, ArgoCD pinning 용
#   - <branch>        : preview, PR / 브랜치 별
#   - latest          : main 브랜치 마지막 빌드 (데모/dev 용)
#
# Visibility: 첫 push 시 GHCR 이 자동으로 private 으로 생성. cledyu 패키지는
# public 운영 (imagePullSecret 운영 부담 0). 첫 사용자 PR 머지 후 한 번만 수동
# 전환 — docs/RUNBOOK/container-image.md "최초 1회 셋업" 참고.

on:
  workflow_call:
    inputs:
      context:
        description: "Build context directory (e.g. apps/web)"
        type: string
        required: true
      dockerfile:
        description: "Dockerfile path relative to context"
        type: string
        default: Dockerfile
      image-name:
        description: "Image name (final segment of ghcr.io/<owner>/<image-name>)"
        type: string
        required: true
      target:
        description: "Multi-stage build target (optional)"
        type: string
        default: ""
      platforms:
        description: "Buildx target platforms"
        type: string
        default: linux/amd64
      trivy-severity:
        description: "Trivy fail severity threshold"
        type: string
        default: CRITICAL,HIGH
      trivyignores:
        description: "Path to .trivyignore file (optional)"
        type: string
        default: ""
      gitops-values-file:
        description: "main push 시 image.tag 를 sha-<short> 로 bump 할 gitops values.yaml 경로 (비우면 bump 안 함)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ inputs.image-name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  build:
    name: build ${{ inputs.image-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ github.event_name != 'pull_request' && ' + push' || ' (PR — no push)' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,scope=${{ inputs.image-name }},mode=max
          provenance: false

      - name: Trivy image scan (HIGH/CRITICAL fail)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          trivyignores: ${{ inputs.trivyignores }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # main push(또는 수동 재발행) 후, 방금 push 한 sha-<short> 태그로 gitops values.yaml 을 bump 한다.
  # ArgoCD 가 변경을 감지해 자동 sync. gitops-values-file 이 비어 있으면(예: dummy) skip.
  #
  # main 은 보호 브랜치(PR + 리뷰 + status check 필수)라 기본 GITHUB_TOKEN 으로는 직접 push 가
  # 거부된다(GH006). enforce_admins=false 이므로 admin 권한 PAT(GITOPS_PAT)로 push 하면 우회된다.
  # GITOPS_PAT 미설정 시에는 bump 를 건너뛰고(빌드는 green 유지) 배포는 :latest 롤아웃에 맡긴다.
  bump:
    name: bump ${{ inputs.image-name }} gitops tag
    needs: build
    if: github.event_name != 'pull_request' && inputs.gitops-values-file != ''
    runs-on: ubuntu-latest
    # 호출자(matrix)마다 별도 워크플로 런이라 워크플로 레벨 concurrency 로는 직렬화되지 않는다.
    # 전역 잡 그룹으로 묶어 동시 push 경합을 막는다(취소 금지 — 모든 bump 를 순차 반영).
    concurrency:
      group: gitops-tag-bump
      cancel-in-progress: false
    steps:
      - name: Check GITOPS_PAT presence
        id: gate
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          if [ -z "$GITOPS_PAT" ]; then
            echo "::warning::GITOPS_PAT 미설정 — 보호된 main 에 push 할 수 없어 gitops 태그 bump 를 건너뜁니다. 배포는 :latest 롤아웃에 의존합니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_PAT }} # admin PAT: 보호 브랜치 우회 push

      - name: Bump image tag in gitops values
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          FILE="${{ inputs.gitops-values-file }}"
          sed -i "s|^  tag:.*|  tag: ${TAG}|" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "tag unchanged, skip commit"
            exit 0
          fi
          git commit -m "chore(gitops): bump ${{ inputs.image-name }} image tag to ${TAG}"
          # 직렬 실행 사이 다른 bump 가 먼저 push 했을 수 있으므로 rebase 후 push.
          git pull --rebase origin main
          git push
