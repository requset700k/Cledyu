{{- /*
  네임스페이스마다 동일한 S3 백업 자격증명 Secret(cledyu-backup-s3)을 만든다.
  키명 ACCESS_KEY_ID/ACCESS_SECRET_KEY 는 CNPG barman·Vault 스냅샷 CronJob 이 참조한다.
  Longhorn 은 키명 규격이 달라(AWS_ACCESS_KEY_ID) 별도 ExternalSecret 로 처리한다(kubevirt 앱).
*/}}
{{- range .Values.namespaces }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-backup-s3
  namespace: {{ . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: aws/backup
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: aws/backup
        property: secret_access_key
{{- end }}
