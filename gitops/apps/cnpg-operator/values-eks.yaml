# CNPG 차트가 monitoring.coreos.com/v1 PodMonitor 를 렌더하는데 EKS DR 엔 Prometheus Operator CRD 가
# 없어 data-cnpg-operator sync 가 깨진다(api ServiceMonitor·B3 와 동일 계열) → 끈다.
# Cluster CR(postgres-cnpg/keycloak-pg)은 Task 7 범위.
monitoring:
  podMonitorEnabled: false
