---
# EKS DR overlay (Task 5) — EKS 는 별도 ArgoCD 인스턴스(self-managed)를 구동.
# OIDC(Keycloak)/Ingress(host) 는 Task 8(Keycloak) 이후 확정.
# controller ServiceMonitor off — 차트가 capability 가드를 쓰긴 하나(monitoring CRD 없으면 skip),
# self-managed ArgoCD 렌더 시점의 capability 불확실성을 없애고 api·cnpg 와 일관되게 명시적으로 끈다.
controller:
  metrics:
    serviceMonitor:
      enabled: false

server:
  # 온프렘 server.ingress 는 className traefik + argocd.cledyu.local — EKS 엔 Traefik 없어 이 Ingress 가
  # 주소 없이 떠 self-managed platform-argocd 가 Progressing 에 묶인다. DR 은 bastion port-forward 로 접근하니 끈다.
  # (OIDC/URL 도 keycloak.cledyu.local 가리키나 kubectl 부트스트랩엔 무관 — 실 ingress/OIDC 는 T8 서 ALB 로 정의.)
  ingress:
    enabled: false
