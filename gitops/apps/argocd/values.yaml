---
# ArgoCD Helm values — chart argo-cd 7.7.10 (app v2.13.2)
# OIDC = Keycloak (cledyu realm), Ingress = Traefik + cert-manager (cledyu-ca).
#
# Sensitive 분리:
#   - argocd client secret 은 argocd-secret 의 oidc.keycloak.clientSecret 키로 별도 patch.
#     (manifest 에 평문 저장 X. 1Password "Cledyu/keycloak-bootstrap-secrets/argocd" 참조)
#   - rootCA inline: cert-manager 의 cledyu-root-ca public 인증서.
#
# 적용:
#   helm upgrade argocd argo/argo-cd -n argocd --version 7.7.10 -f gitops/apps/argocd/values.yaml

applicationSet:
  enabled: true
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 256Mi}
    requests: {cpu: 50m, memory: 64Mi}

controller:
  replicas: 1
  resources:
    limits: {cpu: 2000m, memory: 2Gi}
    requests: {cpu: 100m, memory: 256Mi}
  # application-controller가 argocd_app_info(sync/health) 메트릭을 노출 → Prometheus 수집.
  # 알림(ArgoCDAppOutOfSync/Unhealthy)이 실제로 동작하려면 필수(과거 11일 sync hung 사고 탐지).
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false

global:
  logging:
    format: text
    level: info

notifications:
  enabled: false

redis:
  enabled: true

redis-ha:
  enabled: false

repoServer:
  autoscaling:
    enabled: false
  replicas: 1
  resources:
    limits: {cpu: 1000m, memory: 1Gi}
    requests: {cpu: 50m, memory: 128Mi}

server:
  autoscaling:
    enabled: false
  # Traefik 이 TLS 종료 → ArgoCD 자체는 HTTP 만 받음.
  extraArgs:
    - --insecure
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 50m, memory: 128Mi}
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.cledyu.local
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    # tls: true 는 chart 가 argocd-server-tls 자동 생성 시도 → 우리 cert-manager
    # 의 argocd-tls 와 Ingress.spec.tls[] 에 두 entry 가 중복 → Traefik 이 어느
    # secretName 을 sniff 할지 혼란 → default cert fallback 응답.
    # tls: false + extraTls 만 사용해서 우리 인증서 1개로 명확화.
    tls: false
    extraTls:
      - hosts:
          - argocd.cledyu.local
        secretName: argocd-tls

configs:
  cm:
    exec.enabled: "true"
    url: https://argocd.cledyu.local
    admin.enabled: "true"
    # ExternalSecret 은 CRD 가 spec.data[].remoteRef 와 target 에 기본값을 채우는데 손으로 쓴
    # 매니페스트엔 없어 모든 ESO 앱이 상시 OutOfSync 로 보였다(실질 차이 없음). 그 기본값들만
    # 무시해 sync status 가 정상이 되도록 전역 정규화한다.
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
        - '.spec.target.creationPolicy'
        - '.spec.target.deletionPolicy'
    # resource.exclusions 는 문자열(블록 스칼라)이라 여기서 지정하면 이 키를 통째로 정의한다(병합 아님).
    # 라이브 argocd-cm 엔 cilium CiliumIdentity 제외가 이미 있으나 git 엔 없는 out-of-band 값이다
    # (argo-cd 7.7.10 은 resource.exclusions 기본값이 없음 — helm template 로 실측 확인). 이 키를
    # git 으로 정의하는 순간 그 값이 덮여 cilium 제외가 사라지면 ArgoCD 가 대량의 CiliumIdentity 를
    # 추적하게 된다. 그래서 첫 블록에 cilium 제외를 명시해 현행 동작을 보존·성문화한다.
    # 둘째 블록: velero 가 런타임에 만들어내는 종류를 ArgoCD 추적에서 제외한다. 스케줄이 만든
    # Backup 은 velero 가 Schedule 라벨(argocd.argoproj.io/instance 포함)을 복사해 붙일 수 있고,
    # 그러면 automated prune+selfHeal 이 이를 "git 에 없는 잉여 리소스"로 보고 삭제해 백업이
    # Finalizing 에 고착된다(velero values 의 schedule template.metadata.labels 로 1차 차단하고,
    # 여기서 종류 자체를 추적 대상에서 빼 이중으로 막는다). Schedule / BackupStorageLocation /
    # VolumeSnapshotLocation 은 git 선언형이라 제외 목록에 넣지 않는다(ArgoCD 관리 유지).
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
      - apiGroups:
          - velero.io
        kinds:
          - Backup
          - Restore
          - PodVolumeBackup
          - PodVolumeRestore
          - BackupRepository
          - DownloadRequest
          - DeleteBackupRequest
          - ServerStatusRequest
          - DataUpload
          - DataDownload
        clusters:
          - "*"
    # OIDC = Keycloak (cledyu realm). clientSecret 은 argocd-secret 의 별도 키 참조.
    # requestedScopes 에 'groups' 미포함: keycloak realm 에 groups client scope 미등록 (후속 PR).
    # 대신 Keycloak client argocd 의 protocol mapper (group_membership) 가 모든 토큰에
    # groups claim 자동 추가하므로 RBAC 의 scopes:'[groups]' 는 정상 동작.
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.cledyu.local/realms/cledyu
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true
      # cledyu-root-ca public 인증서 (cert-manager). public CA cert 라 git 평문 저장 OK.
      # CA 회전 시: kubectl -n cert-manager get secret cledyu-root-ca \
      #   -o jsonpath='{.data.tls\.crt}' | base64 -d | sed 's/^/        /' 로 본문 갱신.
      rootCA: |
        -----BEGIN CERTIFICATE-----
        MIIFXDCCA0SgAwIBAgIUAdbfCoY4XJ9ov6m5rAzdcSZemrwwDQYJKoZIhvcNAQEN
        BQAwRjEPMA0GA1UEChMGQ2xlZHl1MRowGAYDVQQLExFQbGF0Zm9ybSBTZWN1cml0
        eTEXMBUGA1UEAxMOQ2xlZHl1IFJvb3QgQ0EwHhcNMjYwNDI0MDYyNDA2WhcNMzYw
