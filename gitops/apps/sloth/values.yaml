replicaCount: 1

customPrometheusRuleLabels:
  release: kps

sloPeriodWindows:
  - "30d"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# sloth 차트는 securityContext.pod / securityContext.container 키를 사용한다.
# container 블록은 sloth·git-sync-plugins 두 컨테이너 모두에 적용된다.
# sloth ns 의 restricted PodSecurity 를 통과하려면 4개 요건(allowPrivilegeEscalation=false,
# drop=ALL, runAsNonRoot=true, seccompProfile=RuntimeDefault)을 모두 만족해야 한다.
# readOnlyRootFilesystem 은 restricted 요건이 아니고 git-sync 쓰기를 깨뜨릴 수 있어 제외한다.
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
