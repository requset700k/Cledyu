---
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: lab-slo
  namespace: monitoring
  labels:
    app: lab-platform
    team: platform
spec:
  service: lab
  labels:
    app: lab-platform
    team: platform
  slos:
    # ───────────────────────────────────────────
    # 가용성 SLO: 99.5% (5xx 에러율 기준)
    # ───────────────────────────────────────────
    - name: requests-availability
      objective: 99.5
      description: "API 서버가 처리하는 전체 요청 중 5xx 에러가 0.5% 미만이어야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(http_requests_total{status=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(http_requests_total[{{.window}}]))
      alerting:
        name: LabAvailabilitySLO
        labels:
          service: lab
          slo: availability
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # 지연 SLO: 99.5% 요청이 1초 이내 응답
    # ───────────────────────────────────────────
    - name: requests-latency
      objective: 99.5
      description: "API 서버가 처리하는 전체 요청 중 99.5%는 1초 이내에 응답해야 한다."
      sli:
        events:
          errorQuery: |
            (sum(rate(http_request_duration_seconds_count[{{.window}}])) or vector(0))
            -
            (sum(rate(http_request_duration_seconds_bucket{le="1"}[{{.window}}])) or vector(0))
          totalQuery: |
            sum(rate(http_request_duration_seconds_count[{{.window}}]))
      alerting:
        name: LabLatencySLO
        labels:
          service: lab
          slo: latency
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # 세션 생성 성공률 SLO: 99.5%
    # ───────────────────────────────────────────
    - name: session-creation-availability
      objective: 99.5
      description: "세션 생성 요청(POST /api/v1/sessions) 중 99.5%가 성공해야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(http_requests_total{method="POST", path="/api/v1/sessions", status=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(http_requests_total{method="POST", path="/api/v1/sessions"}[{{.window}}]))
      alerting:
        name: LabSessionCreationSLO
        labels:
          service: lab
          slo: session-creation
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # Lab 시작 시간 SLO: 온프렘 99.0% 세션이 7분 이내 Ready
    # ───────────────────────────────────────────
    - name: lab-startup-onprem
      objective: 99.0
      description: "온프렘 Lab 시작 요청 중 99%는 7분 이내에 Ready 상태가 되어야 한다."
      sli:
        events:
          errorQuery: |
            (sum(rate(lab_start_total{env="onprem",result!="success"}[{{.window}}])) or vector(0))
            +
            (
              (sum(rate(lab_startup_duration_seconds_count{env="onprem",result="success"}[{{.window}}])) or vector(0))
              -
              (sum(rate(lab_startup_duration_seconds_bucket{env="onprem",result="success",le="420"}[{{.window}}])) or vector(0))
            )
          totalQuery: |
            sum(rate(lab_start_total{env="onprem"}[{{.window}}]))
      alerting:
        name: LabStartupOnpremSLO
        labels:
          service: lab
          slo: startup-onprem
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # Lab 시작 시간 SLO: EC2 99.0% 세션이 10분 이내 Ready
    # ───────────────────────────────────────────
    - name: lab-startup-ec2
      objective: 99.0
      description: "EC2 Lab 시작 요청 중 99%는 10분 이내에 running 상태가 되어야 한다."
      sli:
        events:
          errorQuery: |
            (sum(rate(lab_start_total{env="ec2",result!="success"}[{{.window}}])) or vector(0))
            +
            (
              (sum(rate(lab_startup_duration_seconds_count{env="ec2",result="success"}[{{.window}}])) or vector(0))
              -
              (sum(rate(lab_startup_duration_seconds_bucket{env="ec2",result="success",le="600"}[{{.window}}])) or vector(0))
            )
          totalQuery: |
            sum(rate(lab_start_total{env="ec2"}[{{.window}}]))
      alerting:
        name: LabStartupEC2SLO
        labels:
          service: lab
          slo: startup-ec2
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # Lab 시작 성공률 SLO: 99.0% 세션이 usable 상태까지 도달
    # ───────────────────────────────────────────
    - name: lab-start-success-rate
      objective: 99.0
      description: "Lab 시작 시도 중 99% 이상이 사용 가능한 상태까지 도달해야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(lab_start_total{result!="success"}[{{.window}}])) or vector(0)
          totalQuery: |
            sum(rate(lab_start_total[{{.window}}]))
      alerting:
        name: LabStartSuccessRateSLO
        labels:
          service: lab
          slo: startup-success-rate
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # VM 부팅 성공률 SLO: 99.5%
    # ───────────────────────────────────────────
    - name: vm-boot-success-rate
      objective: 99.5
      description: "KubeVirt/EC2 VM 부팅 성공률이 99.5% 이상이어야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(vm_boot_total{result="failed"}[{{.window}}])) or vector(0)
          totalQuery: |
            sum(rate(vm_boot_total[{{.window}}]))
      alerting:
        name: LabVMBootSuccessRateSLO
        labels:
          service: lab
          slo: vm-boot-success-rate
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # WebSocket 안정성 SLO: 99.0% 연결이 drop 없이 유지
    # ───────────────────────────────────────────
    - name: websocket-stability
      objective: 99.0
      description: "WebSocket 연결 끊김률이 1% 미만이어야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(ws_connection_drop_total[{{.window}}])) or vector(0)
          totalQuery: |
            sum(rate(ws_connection_established_total[{{.window}}]))
      alerting:
        name: LabWebSocketStabilitySLO
        labels:
          service: lab
          slo: websocket-stability
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # Validation 지연 SLO: 99.0% 요청이 10초 이내 응답
    # ───────────────────────────────────────────
    - name: validation-latency
      objective: 99.0
      description: "ValidateStep 처리 요청 중 99%는 10초 이내에 응답해야 한다."
      sli:
        events:
          errorQuery: |
            (sum(rate(validation_duration_seconds_count[{{.window}}])) or vector(0))
            -
            (sum(rate(validation_duration_seconds_bucket{le="10"}[{{.window}}])) or vector(0))
          totalQuery: |
            sum(rate(validation_duration_seconds_count[{{.window}}]))
      alerting:
        name: LabValidationLatencySLO
        labels:
          service: lab
          slo: validation-latency
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
    # ───────────────────────────────────────────
    # AI 힌트 지연 SLO: 99.0% 요청이 5초 이내 응답
    # ───────────────────────────────────────────
    - name: ai-hint-latency
      objective: 99.0
      description: "AI 힌트 요청 중 99%는 5초 이내에 응답해야 한다."
      sli:
        events:
          errorQuery: |
            (sum(rate(ai_hint_latency_seconds_count[{{.window}}])) or vector(0))
            -
            (sum(rate(ai_hint_latency_seconds_bucket{le="5"}[{{.window}}])) or vector(0))
          totalQuery: |
            sum(rate(ai_hint_latency_seconds_count[{{.window}}]))
      alerting:
        name: LabAIHintLatencySLO
        labels:
          service: lab
          slo: ai-hint-latency
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
