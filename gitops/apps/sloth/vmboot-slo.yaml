---
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: vmboot-slo
  namespace: monitoring
  labels:
    app: kubevirt
    team: platform
spec:
  service: vmboot
  labels:
    app: kubevirt
    team: platform
  slos:
    # ───────────────────────────────────────────
    # 부팅 성공률 SLO: VM 99.5% (30일 롤링)
    # vm_boot_total{env="kubevirt"|"ec2", result="success"|"failed"} 기반
    # EC2 온프렘 분리는 보류
    # ───────────────────────────────────────────
    - name: vm-boot-success-rate
      objective: 99.5
      description: "KubeVirt/EC2 VM 부팅 성공률이 99.5% 이상이어야 한다."
      sli:
        events:
          errorQuery: |
            sum(rate(vm_boot_total{result="failed"}[{{ .window }}])) or vector(0)
          totalQuery: |
            sum(rate(vm_boot_total[{{ .window }}])) or vector(1)
      alerting:
        name: KubeVirtVMBootSuccessRateSLO
        labels:
          service: vmboot
          slo: boot-success-rate
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning
