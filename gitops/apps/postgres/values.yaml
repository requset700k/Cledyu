image:
  repository: postgres
  tag: "16-alpine" # 공식 이미지 — 앱 코드와 무관하므로 digest 고정은 renovate 에 위임
  pullPolicy: IfNotPresent

database: cledyu
user: cledyu

# 비밀번호는 Vault(cledyu/db/postgres: password) → ESO → Secret postgres-credentials.
credentials:
  secretName: postgres-credentials
  secretKey: password

storage:
  # 데이터 디스크 — Longhorn 기본 SC(replica 3). DB 는 자체 복제가 없어 스토리지 복제에 의존한다.
  className: longhorn
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
