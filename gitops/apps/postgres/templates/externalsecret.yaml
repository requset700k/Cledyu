# Vault kv(cledyu/db/postgres)의 DB 비밀번호를 Secret 으로 동기화한다.
# 등록 절차: vault kv put cledyu/db/postgres password=<랜덤> (런북 learner-data.md 참고)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentials.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.credentials.secretKey }}
      remoteRef:
        key: db/postgres
        property: password
