---
# Kafka mTLS 클라이언트 인증서(KafkaUser airflow-analytics 시크릿에서 Vault 로 복사한 값).
# vault kv put cledyu/kafka/airflow-analytics user.crt=@user.crt user.key=@user.key ca.crt=@ca.crt
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-kafka-cert
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: airflow-kafka-cert
  data:
    - secretKey: user.crt
      remoteRef:
        key: kafka/airflow-analytics
        property: user.crt
    - secretKey: user.key
      remoteRef:
        key: kafka/airflow-analytics
        property: user.key
    - secretKey: ca.crt
      remoteRef:
        key: kafka/airflow-analytics
        property: ca.crt
