---
# Fernet 키 — Airflow 메타데이터 DB에 저장되는 커넥션 비밀번호 암호화용
# vault kv put cledyu/airflow/fernet-key value=<base64-32byte-key>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-fernet-key
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: airflow-fernet-key
  data:
    - secretKey: fernet-key
      remoteRef:
        key: airflow/fernet-key
        property: value

---
# Webserver secret 키 — Flask 세션 서명용
# vault kv put cledyu/airflow/webserver-secret-key value=<random-string>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-webserver-secret-key
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: airflow-webserver-secret-key
  data:
    - secretKey: webserver-secret-key
      remoteRef:
        key: airflow/webserver-secret-key
        property: value

---
# Keycloak OIDC client secret
# vault kv put cledyu/oidc/airflow client_secret=<keycloak-client-secret>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-oidc
  namespace: airflow
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: airflow-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: oidc/airflow
        property: client_secret
