# Pod가 Kubernetes API 서버에 요청할 때 사용하는 신분증
# deployment.yaml에서 serviceAccountName: validation-engine으로 연결
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-engine
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true # virtctl이 K8s API(portforward)에 접근하기 위해 필요

---
apiVersion: rbac.authorization.k8s.io/v1
# 세션마다 lab-{sessionID} 네임스페이스가 동적으로 생성되므로, 특정 네임스페이스에 바인딩된 Role로는 접근 불가
# ClusterRole로 모든 네임스페이스에 권한 부여.
kind: ClusterRole
metadata:
  name: validation-engine
rules:
  # virtctl이 KubeVirt VM에 SSH 접속하기 위한 권한
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/portforward"]
    verbs: ["get", "update"] # get: 연결 조회, update: 양방향 스트리밍에 필요
  # VM 정보를 조회할 수 있는 권한
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances", "virtualmachines"]
    verbs: ["get", "list"] # 조회만 가능, 생성/삭제는 불가

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: validation-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: validation-engine
subjects:
  - kind: ServiceAccount
    name: validation-engine
    namespace: {{ .Release.Namespace }}
