# Pod가 Kubernetes API 서버에 요청할 때 사용하는 신분증
# deployment.yaml에서 serviceAccountName: validation-engine으로 연결
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validation-engine
  namespace: {{ .Release.Namespace }}
# kubevirt.enabled=false(EKS DR)면 VE 는 KubeVirt 아닌 EC2/SSM 로 채점 → virtctl(K8s API) 불필요.
# 토큰 automount 와 아래 KubeVirt ClusterRole 을 미부여(최소권한, api P2 와 동일 패턴). SA 는 유지(deployment 참조).
automountServiceAccountToken: {{ .Values.kubevirt.enabled }} # virtctl 이 K8s API(portforward) 접근에 사용(kubevirt 시에만)
{{- if .Values.kubevirt.enabled }}

---
apiVersion: rbac.authorization.k8s.io/v1
# ClusterRole — VM 접근 권한 "집합"만 정의한다(바인딩 없음).
# 세션 VM은 lab-{sessionID} 네임스페이스에 동적으로 생성되므로 특정 네임스페이스에
# 고정된 Role로는 닿을 수 없다. 실제 바인딩은 Kyverno generate 정책
# (gitops/apps/kyverno/policies/validation-engine-rolebinding.yaml)이 lab-* 네임스페이스 생성 시
# 이 ClusterRole을 참조하는 RoleBinding을 자동 생성해, validation-engine을 활성 세션
# 네임스페이스로만 한정한다(최소권한).
kind: ClusterRole
metadata:
  name: validation-engine
rules:
  # virtctl이 KubeVirt VM에 SSH 접속하기 위한 권한
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/portforward"]
    verbs: ["get", "update"] # get: 연결 조회, update: 양방향 스트리밍에 필요
  # VM 정보를 조회할 수 있는 권한
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances", "virtualmachines"]
    verbs: ["get", "list"] # 조회만 가능, 생성/삭제는 불가
{{- end }}
