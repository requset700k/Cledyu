---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }} # service-validation-engine.yaml에 적힌 namespace: validation-engine
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# validation-engine이 VM에 접근하기 위한 RBAC이 이 네임스페이스에 배포된다.
# VM을 실제로 소유하는 건 Session API이므로 validation-engine 삭제 시 이 네임스페이스는 보존한다.
# virt-launcher Pod는 KVM 디바이스 접근과 네트워크 인터페이스 조작이 필요해 privileged로 설정한다.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.labVMNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
