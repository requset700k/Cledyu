---
# EKS DR overlay (Task 5) — deltas only, layered on top of values.yaml.
# 동일 ALB group(cledyu-dr)을 api 와 공유 — scheme/target-type 이 그룹 내에서
# 일치하지 않으면 aws-load-balancer-controller 가 충돌로 reconcile 실패시킨다.
replicaCount: 1

ingress:
  className: alb
  # Ingress host 를 .com 단일로 교정(B6). app.cledyu.com 은 와일드카드 *.cledyu.com ACM 과 매칭.
  hosts:
    - app.cledyu.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: cledyu-dr
    # 공개 WAF 연결 — 그룹(cledyu-dr) 공유 ALB 에 붙는 ALB 레벨 설정이라 api 와 동일 ARN 필수(불일치=reconcile 실패).
    # web 자체엔 /metrics 가 없지만, WAF 는 ALB(=api·web 공유) 단위로 연결되므로 그룹 멤버 모두 일치시킨다.
    # 상세 주석은 api/values-eks.yaml 참조.
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-2:504284203153:regional/webacl/cledyu-lab-public/1a75fff2-a358-4f02-85f4-48f4714a2c0c
    # HTTPS 443 리스너 명시(cert 자동발견만으론 안 생김). 그룹(cledyu-dr) 멤버 api 와 동일하게 맞춘다.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # web 은 프로브가 없고 AUTH_ENABLED 시 '/'가 로그인 리다이렉트(302)일 수 있어, 기본 200-only 헬스체크로는
    # target 이 unhealthy 가 될 수 있다 → 2xx/3xx 를 healthy 로 인정(파드가 응답하면 up). 드릴서 실제 응답 코드 확인.
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # certificate-arn 미지정 → ALB Controller 가 spec.tls host(app.cledyu.com)로 *.cledyu.com ACM 자동발견(443 리스너).
    # api/values-eks.yaml 주석 참조. placeholder 불필요.
