image:
  repository: ghcr.io/requset700k/web
  # main 머지 시 build-web.yml 이 latest + sha-<short> 태그로 push.
  # 운영 환경에서는 sha-<short> 태그로 고정 권장.
  tag: sha-3a72b11
  pullPolicy: Always

replicaCount: 1

service:
  port: 3000

ingress:
  host: app.cledyu.local
  tlsSecret: web-tls

env:
  # 학습자 realm(cledyu-learn) OIDC 연동 완료 → 인증 게이트 활성화.
  AUTH_ENABLED: "true"
  # In-cluster Session API endpoint — Next.js route handler가 런타임에 읽어 백엔드로 프록시.
  CLEDYU_BACKEND_URL: "http://api.api.svc.cluster.local"
  # 소셜 로그인 버튼 노출 여부 — terraform enable_social_idp 와 정렬한다.
  # 현재 클러스터는 google/kakao/naver IdP 프로비저닝 완료 → true.
  CLEDYU_SOCIAL_LOGIN_ENABLED: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
