image:
  repository: ghcr.io/requset700k/web
  # main 머지 시 build-web.yml 이 latest + sha-<short> 태그로 push.
  # 운영 환경에서는 sha-<short> 태그로 고정 권장.
  tag: sha-2b37f8a
  pullPolicy: Always

replicaCount: 1

service:
  port: 3000

ingress:
  # .local = Tailscale 내부(비인증 라우팅 확인용), .com = 공개(ALB→프록시→Traefik).
  # 인증 세션 config(cookieDomain 등)는 api values 에서 .cledyu.com 단일.
  hosts:
    - app.cledyu.local
    - app.cledyu.com
  tlsSecret: web-tls

env:
  # 학습자 realm(cledyu-learn) OIDC 연동 완료 → 인증 게이트 활성화.
  AUTH_ENABLED: "true"
  # In-cluster Session API endpoint — Next.js route handler가 런타임에 읽어 백엔드로 프록시.
  CLEDYU_BACKEND_URL: "http://api.api.svc.cluster.local"
  # 노출할 소셜 로그인 버튼 목록(쉼표 구분 alias) — terraform enabled_social_idps
  # (실제 생성된 Keycloak IdP)와 반드시 정렬한다. 미프로비저닝 alias 를 켜면 버튼
  # 클릭 시 "Identity Provider not found" 로 실패한다. 빈 값이면 소셜 섹션 숨김.
  # 구글 IdP 프로비저닝 완료 후 "google", 카카오/네이버 추가 시 확장.
  CLEDYU_SOCIAL_LOGIN_PROVIDERS: "google,naver,kakao"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
