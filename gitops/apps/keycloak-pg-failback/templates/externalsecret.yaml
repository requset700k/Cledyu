## path-swap 시 운영 차트가 렌더 안 되므로, prune 으로 keycloak-pg-credentials 가 orphan 되지 않게 미러.
## deletionPolicy:Retain + cnpg.io/reload 라벨(managed.roles 재적용 트리거) 동일.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-pg-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/postgres
        property: password
