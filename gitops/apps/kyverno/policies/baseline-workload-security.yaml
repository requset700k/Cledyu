---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: baseline-workload-security
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,Job,CronJob
    policies.kyverno.io/title: baseline workload security
    policies.kyverno.io/category: Pod Security Baseline
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforces baseline workload security for application namespaces. System
      namespaces are excluded for platform components that require host-level
      privileges.
spec:
  admission: true
  validationFailureAction: Enforce
  emitWarning: true
  background: true
  rules:
    - name: enforce-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: &system_namespace_exclude
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - kubevirt
                - longhorn-system
                - metallb-system
                - monitoring
                - loki
                - cdi
                - cert-manager
                - falco
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "Privileged containers are not allowed outside approved system namespaces."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true

    - name: enforce-hostpath-volumes
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "hostPath volumes are not allowed outside approved system namespaces."
        foreach:
          - list: "request.object.spec.volumes || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.hostPath.path || '' }}"
                    operator: NotEquals
                    value: ""

    - name: enforce-pod-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "Explicit root pod security contexts are not allowed outside approved system namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.securityContext.runAsUser || `-1` }}"
                operator: Equals
                value: 0
              - key: "{{ request.object.spec.securityContext.runAsNonRoot || `true` }}"
                operator: Equals
                value: false

    - name: enforce-container-root-user
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "Explicit root container users are not allowed outside approved system namespaces."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || `-1` }}"
                    operator: Equals
                    value: 0
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || `-1` }}"
                    operator: Equals
                    value: 0
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsUser || `-1` }}"
                    operator: Equals
                    value: 0

    - name: enforce-run-as-non-root-required
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "Pods must declare runAsNonRoot=true at the pod or container level."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                all:
                  - key: "{{ request.object.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ request.object.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ request.object.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
                  - key: "{{ element.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true

    - name: enforce-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "hostNetwork, hostPID, and hostIPC are not allowed outside approved system namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostNetwork || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostPID || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostIPC || `false` }}"
                operator: Equals
                value: true

    - name: enforce-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system_namespace_exclude
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: "Privilege escalation is not allowed outside approved system namespaces."
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || `false` }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || `false` }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || `false` }}"
                    operator: Equals
                    value: true
