{{- /*
  Velero 전용 S3 자격증명. Velero(velero-plugin-for-aws)는 ACCESS_KEY_ID/ACCESS_SECRET_KEY
  키 분리형이 아니라 [default] 프로파일 형식의 단일 `cloud` 파일 키를 요구하므로, backup-secrets
  의 cledyu-backup-s3(키 분리형)를 재사용하지 못하고 ESO template 으로 프로파일 문자열을 렌더한다.
  velero/ 프리픽스 전용 IAM 키(Vault: cledyu/aws/backup-velero, Task 8 backup.tf writer)를 참조한다.

  주의: 이 파일은 래퍼 차트(velero 서브차트 의존)의 parent 템플릿이라 Helm 이 먼저 렌더한다.
  ESO 런타임 template 플레이스홀더({{ `{{ .access_key_id }}` }} 등)는 backtick raw 문자열로
  이스케이프해 Helm 이 먹지 않고 ESO 에 그대로 전달되게 한다.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-backup-s3-velero
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ `{{ .access_key_id }}` }}
          aws_secret_access_key={{ `{{ .secret_access_key }}` }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: aws/backup-velero
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: aws/backup-velero
        property: secret_access_key
