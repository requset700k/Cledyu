# Vault kv(ai/gemini)의 Gemini API 키를 Secret 으로 동기화한다.
# Vault 에 키가 없으면 Secret 미생성 — deployment 의 optional secretKeyRef 가 흡수하고
# ai-tutor 는 503(ai_unavailable)로 응답해 Session API 정적 힌트 폴백이 동작한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.gemini.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gemini.secretName }}
  data:
    - secretKey: {{ .Values.gemini.secretKey }}
      remoteRef:
        key: ai/gemini
        property: api_key
