{{- if .Values.analytics.enabled }}
---
# D3 강사 분석 — API 가 BigQuery 뷰를 읽는 읽기전용 SA 키.
# vault kv put cledyu/gcp/api-analytics-reader key.json=@reader-key.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.analytics.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.analytics.secretName }}
  data:
    - secretKey: {{ .Values.analytics.secretKey }}
      remoteRef:
        key: gcp/api-analytics-reader
        property: key.json
{{- end }}
