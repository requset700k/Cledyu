---
# Session API 전용 ServiceAccount.
# 기존엔 api 네임스페이스의 default SA(권한 없음)로 동작해 세션 프로비저닝(namespace/secret/VM 생성)이
# 실제 클러스터에서 RBAC 거부됐다. 전용 SA + 최소 ClusterRole 로 필요한 권한만 부여한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true # in-cluster client 가 K8s API 호출에 토큰을 사용

---
# 세션 프로비저너 권한.
# 세션마다 lab-{sessionID} 네임스페이스가 동적으로 생성되므로, namespace(cluster-scoped)뿐 아니라
# 그 안의 secret/VM 권한도 특정 네임스페이스로 한정한 RoleBinding 으로는 줄 수 없어 ClusterRole 로 둔다.
# verb 는 apps/api/internal/kubevirt/session.go 가 실제로 사용하는 동작으로만 한정한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ .Release.Name }}-session-provisioner"
rules:
  # 세션 네임스페이스 생성/조회/삭제 (삭제 시 secret·VM 등 자식 리소스는 cascade 정리).
  # list: 세션 namespace는 cluster-scope라 user/만료 기준 검색에 namespace 목록 전체 조회가
  # 필요하다(FindActiveByUser/CountActiveSessions/Reap*Sessions, session.go). 누락 시 그
  # 함수들이 전부 403으로 실패해 세션 생성(실습 시작)이 막힌다.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  # 세션 네임스페이스에 cloud-init Secret 생성
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # KubeVirt VM 생성
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create"]
  # VM 상태(phase) 조회로 세션 ready/failed 판정
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-session-provisioner"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ .Release.Name }}-session-provisioner"
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}

---
# 세션 VM의 serial console 접근 권한.
# ClusterRoleBinding으로 전역 부여하지 않고 Kyverno가 lab-* namespace마다 RoleBinding을
# 생성해, API가 현재 세션 namespace의 console/portforward에만 접근하도록 제한한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ .Release.Name }}-session-access"
rules:
  # Web 터미널이 사용하는 KubeVirt serial console.
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/console"]
    verbs: ["get"]
  # 읽기 전용 파일 목록은 세션 VM의 22/tcp로 KubeVirt port-forward를 열고,
  # VM 내부 authorized_keys forced command로 범용 셸 실행을 차단한다.
  # API connector는 KubeVirt subresource에 GET WebSocket upgrade만 수행하므로 get만 허용한다.
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/portforward"]
    verbs: ["get"]
