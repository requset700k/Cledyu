---
# Session API 전용 ServiceAccount.
# 기존엔 api 네임스페이스의 default SA(권한 없음)로 동작해 세션 프로비저닝(namespace/secret/VM 생성)이
# 실제 클러스터에서 RBAC 거부됐다. 전용 SA + 최소 ClusterRole 로 필요한 권한만 부여한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true # in-cluster client 가 K8s API 호출에 토큰을 사용

---
# 세션 프로비저너 권한.
# 세션마다 lab-{sessionID} 네임스페이스가 동적으로 생성되므로, namespace(cluster-scoped)뿐 아니라
# 그 안의 secret/VM 권한도 특정 네임스페이스로 한정한 RoleBinding 으로는 줄 수 없어 ClusterRole 로 둔다.
# verb 는 apps/api/internal/kubevirt/session.go 가 실제로 사용하는 동작으로만 한정한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ .Release.Name }}-session-provisioner"
rules:
  # 세션 네임스페이스 생성/조회/삭제 (삭제 시 secret·VM 등 자식 리소스는 cascade 정리)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]
  # 세션 네임스페이스에 cloud-init Secret 생성
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # KubeVirt VM 생성
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create"]
  # VM 상태(phase) 조회로 세션 ready/failed 판정
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ .Release.Name }}-session-provisioner"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ .Release.Name }}-session-provisioner"
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
