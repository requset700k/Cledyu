{{- if .Values.metrics.serviceMonitor.enabled }}
# api 서버의 RED 메트릭(/metrics)을 kube-prometheus-stack 이 스크랩하도록 등록한다.
# kps-prometheus 는 serviceMonitor(Namespace)Selector 가 비어 있어 모든 ns 의 SM 을
# 수집하므로 별도 release 라벨은 불필요하다. SLO 담당자가 Lab SLI 를 이 메트릭 위에 정의한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http          # Service 의 named port(80 → targetPort 8080)
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
