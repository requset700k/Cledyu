{{- if .Values.kafka.enabled }}
---
# Session API 가 Kafka(validation-requests) 에 mTLS 로 발행하기 위한 클라이언트 인증서.
# validation-engine 과 동일하게 kafka-clients-ca ClusterIssuer 로 발급한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-kafka-client
  namespace: {{ .Release.Namespace }}
spec:
  secretName: api-kafka-client-tls # 발급 인증서를 저장할 Secret (deployment 가 마운트)
  duration: "2160h" # 90일
  renewBefore: "720h" # 만료 30일 전 자동 갱신
  commonName: api # Strimzi KafkaUser 이름과 같아야 Kafka 인증/ACL 매칭이 된다
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: kafka-clients-ca
    kind: ClusterIssuer
    group: cert-manager.io

---
# Strimzi KafkaUser — CN=api 인증서로 인증한다(최소권한):
#  - validation-requests 토픽에 발행(검증 요청)
#  - validation-results 토픽을 구독(검증 결과 소비)하고, 전용 컨슈머 그룹 사용
#  - lab-events 토픽에 발행(학습 이벤트 — 분석 파이프라인이 소비)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: api
  namespace: kafka
  labels:
    strimzi.io/cluster: cledyu-kafka
spec:
  authentication:
    type: tls # CN=api 인증서로 인증
  authorization:
    type: simple
    acls:
      # validation-requests 토픽 발행 권한
      - resource:
          type: topic
          name: validation-requests
          patternType: literal
        operations: [Write, Describe]
      # validation-results 토픽 구독 권한(검증 결과 소비)
      - resource:
          type: topic
          name: validation-results
          patternType: literal
        operations: [Read, Describe]
      # 검증 결과 소비용 컨슈머 그룹(api 내부 config kafka.consumer_group 과 일치)
      - resource:
          type: group
          name: cledyu-api-validation-results
          patternType: literal
        operations: [Read]
      # lab-events 토픽 발행 권한(학습 이벤트 — 분석 파이프라인이 소비)
      - resource:
          type: topic
          name: lab-events
          patternType: literal
        operations: [Write, Describe]
{{- end }}
