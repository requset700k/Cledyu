# API 결제 provider 설정. Toss client key는 public 값이지만 secret key와 함께 Vault에서 동기화한다.
# vault kv put cledyu/api/toss toss_client_key=... toss_secret_key=...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.billing.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.billing.secretName }}
  data:
    - secretKey: {{ .Values.billing.clientKey }}
      remoteRef:
        key: api/toss
        property: toss_client_key
    - secretKey: {{ .Values.billing.secretKey }}
      remoteRef:
        key: api/toss
        property: toss_secret_key
