# Session API의 VM 파일 목록 전용 SSH keypair를 Vault에서 동기화한다.
# validation-engine의 lab-ssh-key와 분리해 권한과 폐기 주기를 독립적으로 관리한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.kubevirt.fileListSSH.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kubevirt.fileListSSH.secretName }}
  data:
    - secretKey: {{ .Values.kubevirt.fileListSSH.privateKey }}
      remoteRef:
        key: api/file-list-ssh
        property: private_key
    - secretKey: {{ .Values.kubevirt.fileListSSH.publicKey }}
      remoteRef:
        key: api/file-list-ssh
        property: public_key
