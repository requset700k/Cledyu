apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }} # 세션 프로비저닝 RBAC(rbac.yaml)이 붙은 전용 SA
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # Secret volume의 private key를 nonroot API 프로세스가 읽을 수 있게 그룹 소유권을 부여한다.
        fsGroup: 65532
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: CLEDYU_SERVER_MODE
              value: {{ .Values.env.CLEDYU_SERVER_MODE | quote }}
            - name: CLEDYU_REDIS_ADDR
              value: {{ .Values.env.CLEDYU_REDIS_ADDR | quote }}
            # validation-requests Kafka 발행 — 인증서는 아래 kafka-certs 볼륨(기본 경로 /etc/kafka-certs).
            - name: CLEDYU_KAFKA_BROKERS
              value: {{ .Values.env.CLEDYU_KAFKA_BROKERS | quote }}
            # AI 학습 도우미 BFF — 미가용/빈 값이면 핸들러가 정적 hint_levels 로 폴백.
            - name: CLEDYU_AI_BASE_URL
              value: {{ .Values.env.CLEDYU_AI_BASE_URL | quote }}
            # Billing provider. release 에서 mock 은 차단되고, toss 는 아래 Secret key가 준비되어야 checkout 가능.
            - name: CLEDYU_BILLING_PROVIDER
              value: {{ .Values.billing.provider | quote }}
            - name: CLEDYU_BILLING_TOSS_API_BASE_URL
              value: {{ .Values.billing.tossAPIBaseURL | quote }}
            - name: CLEDYU_BILLING_TOSS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.secretName | quote }}
                  key: {{ .Values.billing.clientKey | quote }}
                  optional: true
            - name: CLEDYU_BILLING_TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.secretName | quote }}
                  key: {{ .Values.billing.secretKey | quote }}
                  optional: true
            # PostgreSQL DSN(비밀번호 포함) — Vault(cledyu/db/api)→ESO Secret. optional:
            # Vault 등록 전에도 파드는 뜨고 in-memory 전용으로 동작한다(시작 로그에 경고).
            - name: CLEDYU_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName | quote }}
                  key: {{ .Values.db.secretKey | quote }}
                  optional: true
            # 세션 실행 백엔드(KubeVirt) 활성 여부. false 면 kubevirt manager 미생성 → 세션 Provider nil →
            # 세션 API 가 처음부터 503(DR 처럼 KubeVirt 없는 환경서 ns 고아 방지). values-eks 에서 false.
            - name: CLEDYU_KUBEVIRT_ENABLED
              value: {{ .Values.kubevirt.enabled | quote }}
            # 세션 VM cloud-init이 lab authorized_keys로 넣는 검증엔진 공개키(공개값이라 평문 OK).
            - name: CLEDYU_KUBEVIRT_LAB_SSH_PUBLIC_KEY
              value: {{ .Values.kubevirt.labSshPublicKey | quote }}
            # 파일 목록 전용 public key는 Secret volume 파일에서 읽는다.
            # Secret 기반 env는 Pod 기동 후 갱신되지 않아 Vault key 사후 등록을 반영할 수 없다.
            - name: CLEDYU_KUBEVIRT_FILE_LIST_SSH_PUBLIC_KEY_PATH
              value: {{ .Values.kubevirt.fileListSSH.publicKeyPath | quote }}
            - name: CLEDYU_KUBEVIRT_FILE_LIST_SSH_PRIVATE_KEY_PATH
              value: {{ .Values.kubevirt.fileListSSH.privateKeyPath | quote }}
            # Keycloak OIDC (학습자 realm cledyu-learn). client_secret 은 Vault→ESO Secret 에서.
            - name: CLEDYU_KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: CLEDYU_KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: CLEDYU_KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            # publicExposure 게이트 — false(기본)=.local, true(컷오버)=.com. 공개 DNS/ALB·
            # Keycloak client .com redirect 준비 전 자동 플립을 막는다(GitOps auto-sync).
            - name: CLEDYU_KEYCLOAK_REDIRECT_URI
              value: {{ ternary .Values.keycloak.publicRedirectUri .Values.keycloak.redirectUri .Values.keycloak.publicExposure | quote }}
            - name: CLEDYU_KEYCLOAK_COOKIE_DOMAIN
              value: {{ ternary .Values.keycloak.publicCookieDomain .Values.keycloak.cookieDomain .Values.keycloak.publicExposure | quote }}
            - name: CLEDYU_FRONTEND_URL
              value: {{ ternary .Values.keycloak.publicFrontendUrl .Values.keycloak.frontendUrl .Values.keycloak.publicExposure | quote }}
            - name: CLEDYU_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.clientSecret.secretName | quote }}
                  key: {{ .Values.keycloak.clientSecret.secretKey | quote }}
            # 역할 승격 service-account(realm-management). Secret 미생성 시(optional) 역할 승격 API 만 비활성.
            - name: CLEDYU_KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.keycloak.adminClient.clientId | quote }}
            - name: CLEDYU_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminClient.secretName | quote }}
                  key: {{ .Values.keycloak.adminClient.secretKey | quote }}
                  optional: true
            # go-oidc 가 keycloak(cledyu 내부 CA) TLS 를 신뢰하도록 default cert pool 을
            # 아래 마운트된 cledyu Root CA 로 지정. api 의 외부 TLS 대상은 keycloak 뿐이다
            # (redis 평문, kafka mTLS 는 자체 인증서, kubevirt 는 kubeconfig CA).
            - name: SSL_CERT_FILE
              value: /etc/ssl/cledyu/ca.crt
            {{- if .Values.aws.enabled }}
            # AWS EC2 오버플로우 — 온프렘 풀 만석 시 세션 버스트(Phase 13). enabled=false 면 미주입.
            - name: CLEDYU_AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: CLEDYU_AWS_LAUNCH_TEMPLATE_ID
              value: {{ .Values.aws.launchTemplateId | quote }}
            - name: CLEDYU_AWS_INSTANCE_TYPE
              value: {{ .Values.aws.instanceType | quote }}
            - name: CLEDYU_AWS_MAX_ACTIVE_SESSIONS
              value: {{ .Values.aws.maxActiveSessions | quote }}
            # 최소권한 IAM 키 — Vault(cledyu/aws/api)→ESO(cledyu-api-aws). 표준 AWS SDK env.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secretName | quote }}
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.secretName | quote }}
                  key: secret_access_key
            # Tailscale ephemeral authkey — 세션 인스턴스 cloud-init 의 tailscale up 에 쓰인다.
            # 미설정 시(optional) EC2 세션은 SSM 채점만 가능하고 라이브 터미널/IDE 는 비활성.
            # 필수 AWS 키(cledyu-api-aws)가 아닌 터미널 키 Secret(cledyu-api-tailscale, ExternalSecret 분리)에서
            # 온다 — cledyu-api-aws 의 필수 ref 로 두면 미시드 시 그 Secret 이 안 만들어져 위 AWS_ACCESS_KEY_ID
            # (non-optional) 마운트 실패로 api 기동이 차단된다(Codex P2). 분리로 미시드=터미널만 비활성.
            - name: CLEDYU_AWS_TAILSCALE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: cledyu-api-tailscale
                  key: tailscale_authkey
                  optional: true
            # api 파드 자신이 tsnet 으로 tailnet 가입(tag:cledyu-api) — EC2 세션에 라이브 터미널 SSH 부착용.
            # 세션 cloud-init 용 CLEDYU_AWS_TAILSCALE_AUTH_KEY 와 별개 키(config AWSConfig.APITailscaleAuthKey).
            # 별도 Secret(cledyu-api-tailscale, ExternalSecret 분리)에서 온다 — 부재가 필수 AWS 키 동기화를
            # 막지 않게(Codex P1). 라이브 터미널은 DR 실습에 필수라 이 authkey 는 부트스트랩 필수 시드(런북).
            # optional 은 파드 방어용(미시드여도 크래시 대신 터미널만 비활성).
            - name: CLEDYU_AWS_API_TAILSCALE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: cledyu-api-tailscale
                  key: api_tailscale_authkey
                  optional: true
            # tsnet 상태 디렉터리 — 명시 필수. 이미지가 distroless(static-debian12)+UID65532 라 홈/config 기본경로가
            # 쓰기 불가 → Dir 미지정 시 tsnet 이 기본 config 경로에 쓰려다 srv.Up 실패 → authkey 시드돼도 터미널
            # 비활성(Codex P1). 아래 tsnet-state emptyDir(쓰기 가능)에 매핑. config.APITailnetStateDir 매핑.
            - name: CLEDYU_AWS_API_TAILNET_STATE_DIR
              value: /var/lib/tsnet
            {{- end }}
            {{- if .Values.analytics.enabled }}
            # D3 강사 분석 — BigQuery 뷰 읽기전용. projectId 설정 시 /api/v1/instructor/analytics 활성(미설정 시 503).
            - name: CLEDYU_ANALYTICS_PROJECT_ID
              value: {{ .Values.analytics.projectId | quote }}
            - name: CLEDYU_ANALYTICS_DATASET
              value: {{ .Values.analytics.dataset | quote }}
            # 읽기전용 SA 키(아래 bq-reader 볼륨) — Google client ADC 표준 env.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/%s" .Values.analytics.credentialsMountPath .Values.analytics.secretKey | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.kafka.enabled }}
            - name: kafka-certs
              mountPath: /etc/kafka-certs
              readOnly: true
            {{- end }}
            {{- if .Values.aws.enabled }}
            # api tsnet(라이브 터미널) 상태 저장 — 쓰기 가능해야 srv.Up 성공(Codex P1). CLEDYU_AWS_API_TAILNET_STATE_DIR 과 동일 경로.
            - name: tsnet-state
              mountPath: /var/lib/tsnet
            {{- end }}
            - name: cledyu-ca
              mountPath: /etc/ssl/cledyu
              readOnly: true
            - name: vm-file-ssh
              mountPath: {{ .Values.kubevirt.fileListSSH.mountPath | quote }}
              readOnly: true
            {{- if .Values.analytics.enabled }}
            - name: bq-reader
              mountPath: {{ .Values.analytics.credentialsMountPath | quote }}
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.kafka.enabled }}
        - name: kafka-certs
          secret:
            secretName: api-kafka-client-tls
        {{- end }}
        {{- if .Values.aws.enabled }}
        # api tsnet(라이브 터미널) 상태 — 쓰기 가능 emptyDir. 이미지가 distroless+UID65532 라 기본 config 경로
        # 쓰기 불가 → 이 볼륨을 명시하고 CLEDYU_AWS_API_TAILNET_STATE_DIR 로 가리켜야 srv.Up 성공(Codex P1).
        - name: tsnet-state
          emptyDir: {}
        {{- end }}
        - name: cledyu-ca
          configMap:
            name: cledyu-root-ca-bundle  # trust-manager 가 ns 라벨 기준으로 배포(키: ca.crt)
        # Vault key가 아직 없더라도 API Pod는 정상 기동하고 파일 목록 기능만 비활성화한다.
        - name: vm-file-ssh
          secret:
            secretName: {{ .Values.kubevirt.fileListSSH.secretName | quote }}
            optional: true
            defaultMode: 288 # 0o440 — root와 fsGroup(65532)만 읽기 가능
            items:
              - key: {{ .Values.kubevirt.fileListSSH.publicKey | quote }}
                path: public_key
              - key: {{ .Values.kubevirt.fileListSSH.privateKey | quote }}
                path: id_ed25519
        {{- if .Values.analytics.enabled }}
        # 읽기전용 BigQuery SA 키. Vault key 미등록이어도 Pod 는 뜨고 분석만 비활성(optional).
        - name: bq-reader
          secret:
            secretName: {{ .Values.analytics.secretName | quote }}
            optional: true
            defaultMode: 288 # 0o440 — root와 fsGroup(65532)만 읽기 가능
        {{- end }}
