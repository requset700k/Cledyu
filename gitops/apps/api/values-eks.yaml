---
# EKS DR overlay (Task 5) — deltas only, layered on top of values.yaml.
# Ingress: Traefik(onprem) -> ALB(EKS). ALB Ingress Controller merges all
# Ingress resources sharing the same group.name into a single ALB, so
# scheme/target-type must match across api+web (see web/values-eks.yaml).
replicaCount: 1

# 실습 스택 활성(풀서비스 DR) — A1 Kafka + A2 validation-engine + EC2 백엔드로 세션·검증이 EKS 에서 동작.
kafka:
  enabled: true    # A1 Kafka 배포됨 → api-kafka-client cert·KafkaUser 렌더, validation 발행·results 소비·lab-events 발행
aws:
  enabled: true    # EC2 실습 백엔드 활성 — 온프렘 부재 시 DR 유일 세션 백엔드(launch template + tailnet)
  maxActiveSessions: 10   # 온프렘 부재 반영해 DR 상한 상향. 실제 값은 노드 용량에 맞춰 조정(Plan B pilot-light 사이징).
kubevirt:
  # DR 백엔드는 EC2(aws overflow)라 KubeVirt 미사용 → enabled=false 유지.
  # sessions 는 EC2 provisioner 로 non-nil(세션 API 정상), validator 는 A2 validation-engine 배포로 non-nil(실검증)
  # → fail-closed 503 은 발동 안 하고 실습 정상 동작. release 모드(CLEDYU_SERVER_MODE)는 그대로 유지(mock-pass 금지).
  # ⚠️ #284(config.go kubevirt.enabled + main.go 스킵 스위치 + deployment CLEDYU_KUBEVIRT_ENABLED)가 main 에
  #    있어야 실제 EC2 경로로 동작 — #284 머지 완료(main 8337c7d)로 전제 충족.
  enabled: false
metrics:
  serviceMonitor:
    enabled: false   # EKS DR 엔 Prometheus Operator(ServiceMonitor CRD) 없음 → sync 블로커 제거 (B3)

ingress:
  className: alb
  # Ingress host 를 .com 단일로 교정 — .local 은 internet-facing ALB 에서 죽은 규칙(B6).
  # api.cledyu.com 은 와일드카드 *.cledyu.com ACM 과 매칭.
  hosts:
    - api.cledyu.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: cledyu-dr
    # 공개 WAF(cledyu-lab-public) 를 ALB 생성과 동시에 연결 — 수동 associate-web-acl 대체(노출 창 제거).
    # api /metrics 는 무인증이라 internet-facing ALB 에 그대로 노출된다. WAF 의 block-public-metrics 룰이
    # ALB 프로비저닝 시점에 붙어 배포 직후부터 /metrics 가 차단된다(Codex P1).
    # ARN 은 terraform output public_waf_web_acl_arn 의 고정값 — WebACL 재생성 시에만 갱신.
    # ⚠️ ALB 레벨 설정이라 그룹(cledyu-dr) 멤버(api·web)에 동일 ARN 필수. 불일치 시 controller reconcile 실패.
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-2:504284203153:regional/webacl/cledyu-lab-public/1a75fff2-a358-4f02-85f4-48f4714a2c0c
    # HTTPS 443 리스너 명시 — cert 자동발견만으론 리스너가 안 생긴다(기본 HTTP 80만). 공식 문서 요구.
    # 그룹(cledyu-dr) 멤버(api·web)는 listen-ports 를 동일하게 맞춰야 한다.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # ALB 기본 헬스체크 경로는 '/'(200 기대)인데 api 라우터는 /health·/ready 만 등록 → '/'는 404.
    alb.ingress.kubernetes.io/healthcheck-path: /ready
    # certificate-arn 미지정 → 443 리스너에 Ingress spec.tls host(api.cledyu.com) 매칭 ACM 을 자동발견해 붙인다
    # (*.cledyu.com·ISSUED·ap-northeast-2, 컨트롤러 IRSA 에 ACM read 있음). → placeholder 불필요, main 그대로 sync.
