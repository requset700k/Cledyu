image:
  repository: ghcr.io/requset700k/api
  tag: sha-bd5f61d
  pullPolicy: Always

replicaCount: 1

service:
  port: 8080

ingress:
  # .com 은 OAuth 콜백(api.cledyu.com/api/v1/auth/callback) 도달점. 일반 데이터 호출은
  # web 이 in-cluster 로 프록시하므로 .com 은 콜백 경로 위주로 쓰인다.
  hosts:
    - api.cledyu.local
    - api.cledyu.com
  tlsSecret: api-tls

# RED 메트릭(/metrics) Prometheus 스크랩. SLO 담당자가 도메인 SLI 를 위에 정의한다.
# serviceMonitor.enabled=false 면 SM 미생성(메트릭 엔드포인트 자체는 항상 노출).
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

env:
  CLEDYU_SERVER_MODE: "release"
  CLEDYU_REDIS_ADDR: "redis.redis.svc:6379"
  CLEDYU_KAFKA_BROKERS: "cledyu-kafka-kafka-bootstrap.kafka.svc:9093"
  # AI 학습 도우미 BFF(service-ai-tutor). 빈 값이면 Lab DSL 정적 hint_levels 폴백.
  CLEDYU_AI_BASE_URL: "http://ai-tutor.ai-tutor.svc:8080"

# PostgreSQL DSN — Vault(cledyu/db/api: dsn)→ESO(cledyu-api-db-externalsecret.yaml)가 만든
# Secret 에서 주입. Secret 미생성 시(optional) in-memory 전용으로 동작한다.
db:
  secretName: "cledyu-api-db"
  secretKey: "dsn"

# Keycloak OIDC (학습자 realm). client_secret 은 Vault→ESO(cledyu-web-oidc-externalsecret.yaml)
# 가 만든 Secret cledyu-api-oidc 에서 주입. 운영자 SSO realm(cledyu)과 분리됨.
keycloak:
  # 공개 host. 학습자 브라우저가 auth.cledyu.com 을 거쳐야 Keycloak 이 broker
  # redirect_uri 를 auth.cledyu.com 으로 생성→Google 등록값과 일치(.local 이면
  # redirect_uri_mismatch). api 서버측 discovery/JWKS/token 도 이 host 사용(ALB hairpin).
  url: "https://auth.cledyu.com"
  realm: "cledyu-learn"
  clientId: "web"
  # 공개(.com) 세션 전환 게이트. service-api ArgoCD 가 main 을 automated sync 하므로 이 값들은
  # merge 즉시 Pod env 로 적용된다. 공개 DNS/ALB(enable_public_ingress=true)와 Keycloak client
  # .com redirect(tfvars apply)가 준비되기 전에 .com 으로 플립하면 현행 .local 인증 흐름까지
  # 깨진다(.com 쿠키·콜백·app redirect 가 아직 미존재). 따라서 기본 false(=.local 유지)로 두고,
  # 컷오버(런북/Task 8: infra apply + keycloak client apply 이후)에서만 true 로 플립한다.
  publicExposure: true
  # 현행(.local) — publicExposure=false 일 때 사용.
  redirectUri: "https://api.cledyu.local/api/v1/auth/callback"
  cookieDomain: ".cledyu.local"
  frontendUrl: "https://app.cledyu.local"
  # 공개(.com) — publicExposure=true(컷오버) 일 때 사용.
  publicRedirectUri: "https://api.cledyu.com/api/v1/auth/callback"
  publicCookieDomain: ".cledyu.com"
  publicFrontendUrl: "https://app.cledyu.com"
  clientSecret:
    secretName: "cledyu-api-oidc"
    secretKey: "client_secret"
  # 역할 승격 service-account(realm-management: manage-users, view-realm).
  # Secret 은 Vault(cledyu/oidc/cledyu-admin: client_secret)→ESO. 미생성 시 역할 승격 API 만 비활성.
  adminClient:
    clientId: "cledyu-admin"
    secretName: "cledyu-api-admin-oidc"
    secretKey: "client_secret"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

kubevirt:
  # 세션 실행 백엔드 활성. 온프렘 기본 true. DR(EKS)은 values-eks 에서 false → 세션 API 503(KubeVirt 미배포).
  enabled: true
  # 세션 VM cloud-init이 lab 사용자 authorized_keys로 넣는 검증엔진 공개키(공개값).
  # 대응 private key는 validation-engine Secret(lab-ssh-key)에 보관 — git에 넣지 않는다.
  labSshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGIZUWVKVjoJzh6dirTVWAtLYewp+SXW54f3uiS8tCFj validation-engine@cledyu"
  # Session API의 읽기 전용 파일 목록 전용 keypair. Vault api/file-list-ssh 에서 동기화한다.
  # 공개키는 새 세션 VM cloud-init에 forced command 형태로 들어가고, private key는 API Pod에 read-only mount된다.
  fileListSSH:
    secretName: "api-file-list-ssh"
    privateKey: "private_key"
    publicKey: "public_key"
    mountPath: "/etc/vm-file-ssh"
    publicKeyPath: "/etc/vm-file-ssh/public_key"
    privateKeyPath: "/etc/vm-file-ssh/id_ed25519"

# Kafka(Strimzi) 커플링 — 온프렘 기본 활성. EKS DR 는 values-eks 에서 false(Strimzi/KafkaUser CRD 미배포 →
# kafka.yaml·kafka-certs 볼륨 미렌더). false 여야 EKS 에서 api Application sync 가 통과한다(F2/F7).
kafka:
  enabled: true

# AWS EC2 오버플로우 — 온프렘 KubeVirt 풀이 가득 차면 세션을 EC2로 버스트한다(Phase 13).
# enabled=false 가 기본 — EC2 비활성(KubeVirt 전용, 현행 동작 보존). 활성화 절차:
#   1) infra/terraform/aws apply → launchTemplateId/region 확보
#   2) AWS 최소권한 키(cledyu-api-aws-externalsecret.yaml)·Tailscale authkey 2종(cledyu-api-tailscale-
#      externalsecret.yaml — 세션 cloud-init 용 + api 파드 tsnet 용, 라이브 터미널)을 Vault 등록
#   3) enabled=true, launchTemplateId 설정, maxActiveSessions>0
aws:
  enabled: true
  region: "ap-northeast-2"
  launchTemplateId: "lt-03243d5c74802ddfd"    # terraform output launch_template_id (cledyu 504284203153)
  instanceType: "t3.medium"
  maxActiveSessions: 2     # EC2 오버플로우 용량(0이면 비활성). 글로벌 상한 = 온프렘 + 이 값.
  # AWS 액세스 키는 Vault(cledyu/aws/api)→ESO(cledyu-api-aws)에서 주입. Tailscale authkey 2종은
  # 같은 Vault 경로지만 별도 Secret(cledyu-api-tailscale, deployment 에 직접 명시)로 분리 — 미시드가
  # 필수 AWS 키 동기화·api 기동을 막지 않게(Codex P1·P2).
  secretName: "cledyu-api-aws"

# D3 강사 분석 — API 가 D2의 cledyu_analytics BigQuery 뷰를 읽어 /api/v1/instructor/analytics 로 제공.
# enabled=false 가 기본 — env/Secret 미주입이고 핸들러는 503(기능 비활성). 활성화 절차:
#   1) GCP 읽기전용 SA 키를 Vault(cledyu/gcp/api-analytics-reader: key.json) 등록 → ESO 가 Secret 동기화
#   2) enabled=true, projectId 설정 — 빈 값이면 서버가 BigQuery 조회기를 주입하지 않아 여전히 503
analytics:
  enabled: false
  projectId: ""               # CLEDYU_ANALYTICS_PROJECT_ID — GCP 프로젝트(예: cledyu-project)
  dataset: "cledyu_analytics" # CLEDYU_ANALYTICS_DATASET
  # 읽기전용 SA 키 — Vault(gcp/api-analytics-reader)→ESO(externalsecret-bq-reader.yaml).
  secretName: "api-bq-reader"
  secretKey: "key.json"
  # GOOGLE_APPLICATION_CREDENTIALS = <credentialsMountPath>/<secretKey> (Google client ADC 표준).
  credentialsMountPath: "/etc/gcp/api-bq-reader"
