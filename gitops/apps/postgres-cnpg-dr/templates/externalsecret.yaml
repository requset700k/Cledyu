## postgres-credentials-cnpg — cluster.yaml managed.roles(cledyu role)의 password 소스.
## 운영에선 postgres-cnpg/templates/scheduledbackup.yaml 이 같은 이름으로 만들지만, EKS(apps-eks)엔
## 운영 postgres-cnpg 앱이 배포되지 않으므로 이 DR 차트가 ESO 로 직접 만든다.
## Vault cledyu/db/postgres(username/password) → ClusterSecretStore vault-backend(복원된 Vault).
##
## api 접속 DSN 은 별도 키(cledyu/db/api:dsn) → cledyu-api-db 로 주입되지만, 두 Vault 키의 cledyu
## 비번은 동일해야 하는 불변식이다(learner-data.md §4 회전 절차가 두 키 동시 갱신을 강제). managed.roles
## 는 db/postgres 값으로 복원 DB role 을 ALTER 하므로, 그 불변식 하에서 api(db/api DSN) 인증이 맞는다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials-cnpg
  namespace: {{ .Release.Namespace }}
  annotations:
    # 부트스트랩 초기 Vault/CRD 미도달 시 dryrun 실패로 sync 가 막히지 않게.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials-cnpg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG managed.roles 가 이 Secret 변경을 감지해 role password 를 재적용(ALTER ROLE)하려면
          # 이 라벨이 필요하다. 없으면 회전·재시드 시 Secret 만 바뀌고 DB role 은 옛 비번으로 남아 인증 붕괴.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: db/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: db/postgres
        property: password
