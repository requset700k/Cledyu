## cledyu 커스텀 로그인 테마. 소스는 infra/keycloak-theme/cledyu/login/*(차트 files/ 로 복사).
## CR volume 이 items 로 각 키를 테마 디렉터리 경로에 매핑 → /opt/keycloak/themes/cledyu/login/... 로 마운트.
## realm login_theme=cledyu 는 복원 DB(terraform 설정)에 이미 있어 이 테마를 로드한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.themeConfigMap }}
  namespace: {{ .Release.Namespace }}
data:
  theme.properties: |
{{ .Files.Get "files/theme.properties" | indent 4 }}
  cledyu.css: |
{{ .Files.Get "files/cledyu.css" | indent 4 }}
  messages_ko.properties: |
{{ .Files.Get "files/messages_ko.properties" | indent 4 }}
