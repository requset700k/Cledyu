## ALB Ingress — auth.cledyu.com 을 공개 노출. 오퍼레이터 CR 은 ingress.enabled=false 라 여기서 별도 생성.
## ALB 그룹 cledyu-dr 공유(api·web·keycloak 단일 ALB). ⚠ 그룹 멤버는 ALB 레벨 설정(scheme·listen-ports·
## WAF·ssl-redirect)을 동일하게 맞춰야 컨트롤러 reconcile 이 성공한다(api values-eks 와 1:1 정렬).
## certificate-arn 미지정 → spec.tls host(auth.cledyu.com)에 매칭되는 *.cledyu.com ACM 자동발견.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.group }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.ingress.wafAclArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath }}
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.serviceName }}
                port:
                  number: {{ .Values.ingress.servicePort }}
