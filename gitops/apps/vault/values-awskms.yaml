---
# AWS KMS auto-unseal — awskms 단독 (gcpckms -> awskms 마이그레이션 완료 후 정리본).
# values.yaml 위에 override (server.ha.raft.config 통째 교체).
#
# 이력: 원래 gcpckms(GCP Cloud KMS) auto-unseal 이었으나 DR 을 AWS 기반으로 정하면서
# awskms 로 seal 마이그레이션함(런북: docs/RUNBOOK/vault-seal-migration-awskms.md).
# 마이그레이션 완료·검증 후 이 정리 PR 에서 disabled gcpckms 블록과 GCP creds 를 제거하여
# awskms 단독으로 만들었다. 이제 Vault unseal 은 GCP 에 의존하지 않는다(AWS 자기완결).
#
# 사용 AWS 자원(504284203153 / ap-northeast-2, out-of-band 부트스트랩 — DR-durable):
#   KMS key   = alias/cledyu-vault-unseal
#               arn:aws:kms:ap-northeast-2:504284203153:key/e29e3ec2-f5e0-4308-af6f-5b576cc99f52
#               DR-durable, 삭제 금지(복원 스냅샷 unseal 에 동일 키 필요).
#   IAM user  = cledyu-vault-unseal (kms:Encrypt/Decrypt/DescribeKey on the key)
#   k8s Secret= vault-aws-kms-creds (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) — 유지보수 창에서
#               kubectl 로 직접 생성(런북). Vault unseal 은 ESO 부트스트랩 못 씀(chicken-egg).

server:
  # awskms seal 이 표준 AWS 자격증명 체인(env)에서 읽는다.
  extraSecretEnvironmentVars:
    - envName: AWS_ACCESS_KEY_ID
      secretName: vault-aws-kms-creds
      secretKey: AWS_ACCESS_KEY_ID
    - envName: AWS_SECRET_ACCESS_KEY
      secretName: vault-aws-kms-creds
      secretKey: AWS_SECRET_ACCESS_KEY

  volumes:
    - name: vault-tls
      secret:
        secretName: vault-tls

  volumeMounts:
    - name: vault-tls
      mountPath: /vault/tls
      readOnly: true

  ha:
    enabled: true
    raft:
      enabled: true
      config: |
        ui = true
        # Keep aligned with base values.yaml: restricted PSA drops CAP_IPC_LOCK, so mlock is disabled.
        # This assumes Kubernetes nodes run with swap disabled.
        disable_mlock = true

        # awskms 단독 auto-unseal (gcpckms 마이그레이션 완료 후 정리).
        seal "awskms" {
          region     = "ap-northeast-2"
          kms_key_id = "arn:aws:kms:ap-northeast-2:504284203153:key/e29e3ec2-f5e0-4308-af6f-5b576cc99f52"
        }

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 0
          tls_cert_file = "/vault/tls/tls.crt"
          tls_key_file = "/vault/tls/tls.key"
          tls_client_ca_file = "/vault/tls/ca.crt"

          # Keep aligned with base values.yaml so KMS overlay does not drop metrics behavior.
          # Revisit when ServiceMonitor scraping uses authenticated access or a dedicated metrics listener.
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file = "/vault/tls/ca.crt"
          }

          retry_join {
            leader_api_addr = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file = "/vault/tls/ca.crt"
          }

          retry_join {
            leader_api_addr = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file = "/vault/tls/ca.crt"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
