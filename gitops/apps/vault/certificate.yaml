---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault-tls
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cledyu-ca
  commonName: vault.cledyu.local
  dnsNames:
    - vault.cledyu.local
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault"
    - "*.vault-internal.vault.svc"
    - "*.vault-internal.vault.svc.cluster.local"
  # 파드 기본 VAULT_ADDR 는 https://127.0.0.1:8200 이다. IP SAN 이 없으면 in-pod vault CLI 가
  # x509(cannot validate for 127.0.0.1, no IP SANs)로 실패한다(DR 드릴 실측) → 127.0.0.1 IP SAN 추가.
  # 이게 있어야 런북의 in-pod `VAULT_CACERT=.. vault operator init/restore` 명령이 그대로 통한다.
  ipAddresses:
    - "127.0.0.1"
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
