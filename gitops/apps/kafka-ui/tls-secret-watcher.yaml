---
# kafka-ui Deployment는 kafka-ui-kafka-client-tls의 tls.key를 env(secretKeyRef)로 주입받는데,
# k8s는 Secret이 바뀌어도 떠있는 Pod의 env를 갱신하지 않는다. cert-manager가 인증서를
# 재발급(수동 강제 재발급 또는 자연 갱신)해도 Pod가 재시작 전까지 옛 키를 계속 들고 있어
# AdminClient가 다시 깨지는 걸 막기 위한 워치독. Reloader 같은 클러스터 전역 도구 없이
# kafka-ui 하나에만 좁게 적용한다.
#
# [주의] 이 CronJob은 ArgoCD가 관리하는 Deployment/kafka-ui의 pod template annotation을 직접 패치한다.
# data-kafka-ui ArgoCD 앱의 ignoreDifferences에 cledyu.io/tls-secret-checksum을 제외해뒀으므로
# ServerSideApply로 전환해도 ArgoCD와 충돌하지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-ui-tls-watcher
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-ui-tls-watcher
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kafka-ui-kafka-client-tls"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kafka-ui"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-ui-tls-watcher
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-ui-tls-watcher
subjects:
  - kind: ServiceAccount
    name: kafka-ui-tls-watcher
    namespace: kafka
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kafka-ui-tls-watcher
  namespace: kafka
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: kafka-ui-tls-watcher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watcher
              image: alpine/k8s:1.31.1@sha256:dfe8c7a06c41d0b6e8757da99531f8f302e9a2687fa0155af4c4087df585c9c8
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  CURRENT=$(kubectl get secret kafka-ui-kafka-client-tls -n kafka -o jsonpath='{.data.tls\.key}' | sha256sum | cut -d' ' -f1)
                  LAST=$(kubectl get deployment kafka-ui -n kafka -o jsonpath='{.spec.template.metadata.annotations.cledyu\.io/tls-secret-checksum}' 2>/dev/null || true)
                  if [ "$CURRENT" != "$LAST" ]; then
                    echo "tls secret changed ($LAST -> $CURRENT), restarting kafka-ui"
                    kubectl patch deployment kafka-ui -n kafka --type=merge \
                      -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"cledyu.io/tls-secret-checksum\":\"$CURRENT\"}}}}}"
                  else
                    echo "tls secret unchanged ($CURRENT)"
                  fi
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 100m, memory: 128Mi }
          volumes:
            - name: tmp
              emptyDir: {}
