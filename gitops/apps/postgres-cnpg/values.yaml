# cledyu Postgres → CNPG 이관 차트 values.
# 백업 대상 = 과금 데이터(수료증·진도·리더보드). RPO 5~15분(WAL 연속 아카이빙 + 일 base backup).
# 소비자는 api 하나(Vault cledyu/db/api:dsn → ESO Secret cledyu-api-db → CLEDYU_DB_DSN).

# 단일 인스턴스 — DR 목적은 백업이지 HA가 아니며 현 규모·예산에서 다중 인스턴스는 과잉.
# HA 필요 시 2로 올린다(T4 범위 밖).
instances: 1

storage:
  # 구 StatefulSet과 동일 스토리지 규격 유지(Longhorn 10Gi). 데이터는 barman S3가 durability 담당.
  className: longhorn
  size: 10Gi

# 구 StatefulSet(gitops/apps/postgres)과 동일값 — 미지정 시 BestEffort QoS로 스케줄되어
# 온프렘 제약 클러스터에서 OOM/noisy-neighbor 위험이 있다(과금 핵심 DB이므로 QoS 보장 필요).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# failback 아카이브 계보 epoch(완료된 failback 횟수). 0=현행(접미 없음). failback 런북이 lockstep bump.
# backup serverName = cledyu-pg{-e{drEpoch}} → 매 failback 후 빈 새 아카이브 경로(Object Lock 충돌 회피).
drEpoch: 0
