## CNPG Cluster — 구 postgres StatefulSet을 논리 import(microservice)로 이관하고,
## barman으로 S3(postgres/ 프리픽스)에 WAL 연속 아카이빙 + base backup을 남긴다.
##
## 버전 주의(2026-07-06 실측): 배포 오퍼레이터 = cnpg chart 0.23.0 = 1.25.0.
## in-tree spec.backup.barmanObjectStore는 1.26부터 deprecated(barman-cloud 플러그인이 후속)이나
## 1.25.0에서는 기본·정상 동작. 오퍼레이터를 chart 0.23.0(=1.25.0)에 핀 고정 유지.
## ≥1.26 상향 시 barman-cloud 플러그인으로 이관 필요.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cledyu-pg
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.instances }}
  # 구 DB(postgres:16-alpine)와 동일 major 16 — 논리 import 안전.
  # 태그만으론 재풀 시 revision 드리프트 여지가 있어 digest까지 고정
  # 오퍼레이터 상향 등으로 CNPG 호환 Postgres 버전이 바뀌면 이 digest도 같이 갱신해야 한다.
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe"
  storage:
    size: {{ .Values.storage.size }}
    storageClass: {{ .Values.storage.className }}
  # 구 StatefulSet과 동등한 QoS 보장(BestEffort 방지) — 코드 리뷰로 발견, 값은 values.yaml 참조.
  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu }}
      memory: {{ .Values.resources.requests.memory }}
    limits:
      cpu: {{ .Values.resources.limits.cpu }}
      memory: {{ .Values.resources.limits.memory }}
  bootstrap:
    # 최초 이관: 구 postgres(old-postgres)에서 논리 import(microservice)로 완료됨(2026-07-07, Task 4).
    # 운영 중 cledyu-pg 는 이미 부트스트랩이 끝나 이 블록은 무시된다(bootstrap 은 생성 시 1회만 실행).
    #
    # ⚠ 재생성 시 fail-safe(의도됨): 구 DB 폐기 후 이 매니페스트로 CR 을 다시 만들면 import 소스
    #    (postgres.postgres.svc)가 없어 bootstrap 이 실패한다. 이는 버그가 아니라 안전장치다 —
    #    stateful DB 를 자동으로 빈 상태/잘못된 소스로 재생성하지 않게 막고, 수동 DR 을 강제한다.
    #    (운영 매니페스트에 S3 recovery 를 직접 넣지 않는 이유: 복구 클러스터가 원본 아카이브
    #     serverName=cledyu-pg 에 WAL 을 쓰려다 CNPG "Expected empty archive" 로 Setting up primary
    #     에서 멈춘다. → 아카이브 충돌.)
    # ▶ 실제 DR 복구는 이 운영 매니페스트가 아니라 별도 복구 매니페스트로 수행한다:
    #    - 복원 메커니즘(S3 barman → CNPG bootstrap.recovery)은 docs/RUNBOOK/dr-restore-drill.md
    #      드릴에서 검증됨(임시 cledyu-pg-drill 로 복원·확인 후 폐기 = 절차가 아니라 복원성 증명).
    #    - 전체-사이트 DR(온프렘 손실): Plan C 오케스트레이션이 그 매니페스트를 EKS 에 재사용해 복원.
    #    - 인플레이스 복구(cledyu-pg 만 손실): recovery + 고유 backup serverName 매니페스트 적용 후
    #      GitOps 재정렬. 구체 절차 런북은 아직 미작성(TBD, Plan C 계열 후속).
    initdb:
      # 계약: owner 는 아래 secret(postgres-credentials-cnpg)의 username 과 일치해야 한다(CNPG 검증).
      database: cledyu
      owner: cledyu
      secret:
        name: postgres-credentials-cnpg
      import:
        type: microservice
        databases:
          - cledyu
        source:
          externalCluster: old-postgres
  externalClusters:
    # 구 DB import 소스(폐기됨). 위 fail-safe 설명 참조 — 재생성 시 여기서 연결 실패로 멈춘다.
    - name: old-postgres
      connectionParameters:
        host: postgres.postgres.svc
        user: cledyu
        dbname: cledyu
      password:
        name: postgres-credentials-cnpg
        key: password
  backup:
    barmanObjectStore:
      destinationPath: "s3://cledyu-lab-dr-backups/postgres"
      endpointURL: "https://s3.ap-northeast-2.amazonaws.com"
      # Task 2가 postgres ns에 뿌린 Secret(프리픽스 postgres/ 한정 IAM 키).
      s3Credentials:
        accessKeyId:
          name: cledyu-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cledyu-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
    # retentionPolicy 의도적으로 미설정. 설정 시 CNPG가 barman-cloud-backup-delete로
    # 만료 backup/WAL을 직접 지우려 하는데, backup-writer-postgres IAM 정책엔 s3:DeleteObject가
    # 없고(무-delete 정책, infra/terraform/aws/backup.tf) 버킷엔 Object Lock GOVERNANCE 30일까지
    # 걸려 있어(BypassGovernanceRetention도 없음) 매 retention maintenance가 AccessDenied로
    # 실패한다. 삭제는 전적으로 S3 lifecycle(backup.tf의 postgres/ 프리픽스 규칙)이 담당한다.
  # 백업 성공/실패, WAL 아카이빙 지연, 커넥션 등을 Prometheus로 노출
  # PodMonitor CR을 자동 생성해 기존 kube-prometheus-stack이 스크레이프
  # 주의: CNPG 1.25 기준 enablePodMonitor는 deprecated
  # 지금 핀 고정한 1.25.0에선 정상 동작. 오퍼레이터 상향 시 수동 PodMonitor 리소스로 교체 필요
  monitoring:
    enablePodMonitor: true
