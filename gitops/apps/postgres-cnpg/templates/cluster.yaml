## CNPG Cluster — 구 postgres StatefulSet을 논리 import(microservice)로 이관하고,
## barman으로 S3(postgres/ 프리픽스)에 WAL 연속 아카이빙 + base backup을 남긴다.
##
## 버전 주의(2026-07-06 실측): 배포 오퍼레이터 = cnpg chart 0.23.0 = 1.25.0.
## in-tree spec.backup.barmanObjectStore는 1.26부터 deprecated(barman-cloud 플러그인이 후속)이나
## 1.25.0에서는 기본·정상 동작. 오퍼레이터를 chart 0.23.0(=1.25.0)에 핀 고정 유지.
## ≥1.26 상향 시 barman-cloud 플러그인으로 이관 필요.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cledyu-pg
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.instances }}
  # 구 DB(postgres:16-alpine)와 동일 major 16 — 논리 import 안전.
  # 태그만으론 재풀 시 revision 드리프트 여지가 있어 digest까지 고정
  # 오퍼레이터 상향 등으로 CNPG 호환 Postgres 버전이 바뀌면 이 digest도 같이 갱신해야 한다.
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe"
  storage:
    size: {{ .Values.storage.size }}
    storageClass: {{ .Values.storage.className }}
  # 구 StatefulSet과 동등한 QoS 보장(BestEffort 방지) — 코드 리뷰로 발견, 값은 values.yaml 참조.
  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu }}
      memory: {{ .Values.resources.requests.memory }}
    limits:
      cpu: {{ .Values.resources.limits.cpu }}
      memory: {{ .Values.resources.limits.memory }}
  bootstrap:
    # 최초 이관은 구 postgres(old-postgres)에서 논리 import(microservice)로 완료됨(2026-07-07, Task 4).
    # 구 DB 폐기에 맞춰, 재생성/DR 부트스트랩 소스를 구 DB → 자기 S3 barman 백업으로 전환한다.
    #   - 운영 중 cledyu-pg 는 이미 부트스트랩이 끝나 이 변경에 영향 없음(bootstrap 은 생성 시 1회만 실행).
    #   - CR 삭제 후 GitOps 재생성/전체 DR 시에만 이 recovery 경로를 탄다.
    #   - 구 import 방식을 남겨두면 폐기된 postgres.postgres.svc 를 import 하려다 재생성이 막히므로 전환 필수.
    # 이 S3 recovery 경로는 Task 7 PITR 드릴(#266)에서 복원 가능함을 실측 검증(다른 이름으로 복원).
    # recovery 는 백업에서 롤 포함 전체를 복원하므로 initdb(database/owner/secret) 불필요.
    recovery:
      source: cledyu-pg-s3
  externalClusters:
    # 자기 자신의 S3 백업에서 복원. serverName = 원 클러스터명(cledyu-pg) = 기존 백업이 쌓인 경로.
    - name: cledyu-pg-s3
      barmanObjectStore:
        destinationPath: "s3://cledyu-lab-dr-backups/postgres"
        endpointURL: "https://s3.ap-northeast-2.amazonaws.com"
        serverName: cledyu-pg
        s3Credentials:
          accessKeyId:
            name: cledyu-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cledyu-backup-s3
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
  backup:
    barmanObjectStore:
      destinationPath: "s3://cledyu-lab-dr-backups/postgres"
      endpointURL: "https://s3.ap-northeast-2.amazonaws.com"
      # Task 2가 postgres ns에 뿌린 Secret(프리픽스 postgres/ 한정 IAM 키).
      s3Credentials:
        accessKeyId:
          name: cledyu-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cledyu-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
    # retentionPolicy 의도적으로 미설정. 설정 시 CNPG가 barman-cloud-backup-delete로
    # 만료 backup/WAL을 직접 지우려 하는데, backup-writer-postgres IAM 정책엔 s3:DeleteObject가
    # 없고(무-delete 정책, infra/terraform/aws/backup.tf) 버킷엔 Object Lock GOVERNANCE 30일까지
    # 걸려 있어(BypassGovernanceRetention도 없음) 매 retention maintenance가 AccessDenied로
    # 실패한다. 삭제는 전적으로 S3 lifecycle(backup.tf의 postgres/ 프리픽스 규칙)이 담당한다.
  # 백업 성공/실패, WAL 아카이빙 지연, 커넥션 등을 Prometheus로 노출
  # PodMonitor CR을 자동 생성해 기존 kube-prometheus-stack이 스크레이프
  # 주의: CNPG 1.25 기준 enablePodMonitor는 deprecated
  # 지금 핀 고정한 1.25.0에선 정상 동작. 오퍼레이터 상향 시 수동 PodMonitor 리소스로 교체 필요
  monitoring:
    enablePodMonitor: true
