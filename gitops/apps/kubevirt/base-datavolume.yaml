---
# 세션 VM PVC 클론 원본. CDI가 이 DataVolume을 임포트하면 동명 PVC(ubuntu-2204-base)가 생성된다.
# 세션 VM의 dataVolumeTemplates.source.pvc는 이 PVC를 복제한다.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-2204-base
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    # DataVolume spec(특히 storageClassName/source)은 immutable이라 ArgoCD가 apply로 변경 못 한다.
    # Replace=true 로 두면 spec 변경 시 delete+recreate 해 ArgoCD sync가 immutable 필드 충돌로
    # 영구 OutOfSync/health-wait에 빠지지 않는다(과거 11일간 sync hung 사고의 메커니즘).
    argocd.argoproj.io/sync-options: Replace=true
spec:
  source:
    # stock Ubuntu cloud 이미지 대신, 공통 패키지·qemu-guest-agent 를 미리 구운 베이킹 이미지를
    # import 한다(infra/images/lab-base, ghcr public). 세션 cloud-init 의 apt 비용을 줄인다.
    # 재베이킹 시 이 태그를 bump 한다(Replace=true 라 CDI 가 base PVC 를 재import).
    registry:
      url: "docker://ghcr.io/requset700k/cledyu-lab-base:20260627"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
    storageClassName: longhorn-r2 # replica 2 (lab 디스크 전용 SC)
