---
# 세션 VM PVC 클론 원본. CDI가 이 DataVolume을 임포트하면 동명 PVC(ubuntu-2204-base)가 생성된다.
# 세션 VM의 dataVolumeTemplates.source.pvc는 이 PVC를 복제한다.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-2204-base
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    # DataVolume spec(source/storageClassName 등)은 immutable이라 CDI webhook이 update를 거부한다.
    # Replace=true 만으론 ArgoCD가 kubectl replace(PUT)를 시도해 동일하게 거부당하므로(과거 sync hung),
    # Force=true 를 함께 둬 spec 변경(재베이크 시 이미지 태그 bump) 시 delete+recreate 하게 한다.
    # DataVolume 은 평소 in-sync 라 Force 는 git 변경 시에만 트리거된다(재import 는 의도된 동작).
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  source:
    # stock Ubuntu cloud 이미지 대신, 공통 패키지·qemu-guest-agent 를 미리 구운 베이킹 이미지를
    # import 한다(infra/images/lab-base, ghcr public). 세션 cloud-init 의 apt 비용을 줄인다.
    # 재베이킹 시 이 태그를 bump 한다(Replace=true 라 CDI 가 base PVC 를 재import).
    registry:
      url: "docker://ghcr.io/requset700k/cledyu-lab-base:28346238935"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
    storageClassName: longhorn-r2 # replica 2 (lab 디스크 전용 SC)
