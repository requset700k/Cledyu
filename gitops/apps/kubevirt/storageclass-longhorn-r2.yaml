---
# lab VM 디스크 전용 StorageClass — 기본 longhorn(replica 3)과 동일하되 replica 2.
# 이유:
#  - lab VM 디스크는 ephemeral(베이스 PVC 클론, 재생성 가능)이라 3중화가 과하다.
#  - 3-replica는 노드 3개 모두 schedulable이어야 배치 가능 → 한 노드라도 용량 한도에 걸리면
#    전체 프로비저닝이 막힌다(실제 장애 원인). 2-replica는 2개 노드만으로 배치돼 견고하다.
#  - reclaimPolicy=Delete: 세션 삭제 시 클론 볼륨이 자동 정리돼 Released 볼륨 누적을 막는다
#    (기본 longhorn은 Retain이라 삭제된 세션의 볼륨이 예약을 점유하며 쌓였다).
# 기본 클래스 아님(is-default-class 미지정) — 명시적으로 이 SC를 쓰는 워크로드만 사용.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2
  annotations:
    argocd.argoproj.io/sync-wave: "0" # base DataVolume(wave 30)보다 먼저 생성
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  dataLocality: "disabled"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
