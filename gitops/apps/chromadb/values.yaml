image:
  repository: chromadb/chroma
  tag: "1.0.15"
  pullPolicy: IfNotPresent

service:
  port: 8000

storage:
  className: longhorn
  size: 5Gi
  mountPath: /data

env:
  IS_PERSISTENT: "TRUE"
  PERSIST_DIRECTORY: /data
  ANONYMIZED_TELEMETRY: "FALSE"

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

networkPolicy:
  enabled: true
  allowedPodLabels:
    - app: ai-tutor
    - app: chromadb-indexer
