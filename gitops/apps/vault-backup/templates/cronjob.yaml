# hashicorp/vault:1.21.2 는 Alpine 베이스지만 aws CLI 가 없다(확인 완료: apk info aws-cli 는
# 있으나 기본 이미지엔 미설치). vault·aws 두 바이너리를 한 컨테이너에 넣는 대신, 순차 실행이
# 보장되는 initContainer(스냅샷) → 메인 컨테이너(S3 업로드) 로 분리해 각자 공식 이미지를 그대로
# 쓴다(커스텀 이미지 빌드/유지보수 불필요). 두 컨테이너는 emptyDir 로만 스냅샷 파일을 주고받고,
# 업로드 컨테이너는 Vault 토큰을, 스냅샷 컨테이너는 AWS 자격증명을 각각 갖지 않는다(최소권한).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 */6 * * *"   # 6시간마다 (RPO 1~24h 목표 충족)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-backup
          restartPolicy: OnFailure
          # vault ns는 PSA restricted(namespace.yaml) + Kyverno baseline-workload-security로
          # runAsNonRoot·seccompProfile·capabilities.drop 등을 강제한다(코드 리뷰로 발견 — 이게
          # 없으면 admission에서 거부돼 스냅샷 Pod 자체가 안 뜬다). fsGroup은 두 컨테이너(다른 UID)가
          # 공유하는 snapshot emptyDir에 그룹 쓰기 권한을 준다.
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: snapshot
              emptyDir: {}
            # 기존 ESO ClusterSecretStore(vault-backend)와 동일하게 vault-tls Secret의 실제 CA를 신뢰한다.
            - name: vault-ca
              secret:
                secretName: vault-tls
                items:
                  - key: ca.crt
                    path: ca.crt
          initContainers:
            - name: vault-snapshot
              image: hashicorp/vault:1.21.2
              # 기존 vault StatefulSet(gitops/apps/vault/values.yaml)과 동일하게 UID 100 —
              # 이 클러스터에서 vault 바이너리가 이 UID로 정상 동작함이 이미 검증돼 있다.
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                - name: VAULT_ADDR
                  value: "https://vault-active.vault.svc:8200"
                - name: VAULT_CACERT
                  value: "/vault-ca/ca.crt"
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                - name: vault-ca
                  mountPath: /vault-ca
                  readOnly: true
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=vault-backup jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export VAULT_TOKEN
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  vault operator raft snapshot save /snapshot/vault-raft-$TS.snap
          containers:
            - name: s3-upload
              image: amazon/aws-cli:2.32.7
              # 이미지 기본 유저는 root(확인됨)라 임의의 비-root UID를 강제한다. aws CLI는 자격증명을
              # 전부 env var로 받아(HOME 의존 없음) 임의 UID로도 정상 동작한다.
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
                - name: AWS_DEFAULT_REGION
                  value: "ap-northeast-2"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: cledyu-backup-s3, key: ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: cledyu-backup-s3, key: ACCESS_SECRET_KEY } }
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  for f in /snapshot/*.snap; do
                    aws s3 cp "$f" "s3://cledyu-lab-dr-backups/vault/$(basename "$f")"
                  done
