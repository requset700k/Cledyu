fullnameOverride: kps

# ── Prometheus ────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: "18GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn # Grafana 영속화를 위해 longhorn 스토리지 클래스 사용
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    containers:
      - name: prometheus
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

# ── Alertmanager ─────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn # Alertmanager 영속화를 위해 longhorn 스토리지 클래스 사용
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    containers:
      - name: alertmanager
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

    secrets:
      - alertmanager-discord-webhook
      - alertmanager-discord-webhook-certmanager

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ["namespace", "alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "discord"
      routes:
        - matchers:
            - alertname = "Watchdog" # Watchdog 알림 무시 설정
          receiver: "null"
        - matchers:
            - alertname = "CDIDefaultStorageClassDegraded" # Longhorn CSI clone 미지원으로 인한 false alert — external-snapshotter 도입 시 제거
          receiver: "null"
        - matchers:
            - alertname =~ "Certificate.*"
          receiver: "discord-certmanager"

        # severity=none 이거나 alertname=InfoInhibitor 인 알림 억제 설정
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"

        - matchers:
            - severity = "none"
          receiver: "null"

        # Suspended 앱은 null로
        - matchers:
            - alertname =~ "ArgoCD.*"
            - health_status = "Suspended"
          receiver: "null"

        # ArgoCD 관련 알림 그룹으로 처리
        - matchers:
            - alertname =~ "ArgoCD.*"
            - health_status != "Suspended"
          group_by: ["alertname"]
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 24h
          receiver: "discord"

        # TraefikLatencySLO 플래핑 억제
        - matchers:
            - alertname = "TraefikLatencySLO"
          group_wait: 1m
          group_interval: 15m
          repeat_interval: 24h
          receiver: "discord"

    receivers:
      - name: "null"
      - name: "discord"
        webhook_configs:
          - url: "http://alertmanager-discord-proxy:9094"
            send_resolved: true

      - name: "discord-certmanager"
        webhook_configs:
          - url: "http://alertmanager-discord-proxy-certmanager:9094"
            send_resolved: true

    inhibit_rules:
      # 서비스내 Critical 발생 시 Warning 억제
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["namespace"]

      # 노드 다운 시 파생 워크로드 알림 억제
      # source(KubeNodeNotReady)는 namespace="monitoring"(kube-state-metrics 위치), target pod 알림은
      # 워크로드 namespace라 값이 달라 equal:[namespace]가 매칭되지 않음(공유 토폴로지 라벨 없음).
      # target을 alertname으로 한정해 범위 제한, equal 제거(노드 다운 시 해당 워크로드 알림 전역 억제).
      - source_matchers:
          - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable"
        target_matchers:
          - severity =~ "critical|warning"
          - alertname =~ "KubePodNotReady|KubeContainerWaiting|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDaemonSetNotScheduled"

      # KubeVirt 컨트롤플레인 다운 시 kubevirt namespace 파생 알림 억제
      - source_matchers:
          - alertname =~ "KubeVirtApiAvailabilitySLO|KubeVirtControllerAvailabilitySLO"
          - severity = "critical"
        target_matchers:
          - alertname =~ "KubeVirtApiAvailabilitySLO|KubeVirtControllerAvailabilitySLO|KubeVirtHandlerAvailabilitySLO"
          - severity = "warning"
        equal: ["sloth_service"]

      # KubeVirt SLO critical → KubevirtComponentDown/VirtControllerNotReady 억제
      # source SLO에 namespace 라벨 없어 equal 적용 불가, target을 alertname으로 명시해 범위 제한
      - source_matchers:
          - alertname =~ "KubeVirtApiAvailabilitySLO|KubeVirtControllerAvailabilitySLO"
          - severity = "critical"
        target_matchers:
          - alertname =~ "KubevirtComponentDown|KubevirtVirtControllerNotReady"

      # KubevirtComponentDown → VMI 파생 알림 억제
      # source(KubevirtComponentDown)는 namespace="kubevirt", target VMI 알림은 테넌트 namespace="lab-*"라
      # equal:[namespace]가 매칭되지 않음. target을 alertname으로 한정, equal 제거(컴포넌트 다운 시 VMI 알림 전역 억제).
      - source_matchers:
          - alertname = "KubevirtComponentDown"
        target_matchers:
          - alertname =~ "KubevirtVMIHighCPU|KubevirtVMIMemorySwap"

# ── Grafana ───────────────────────────────────────────────────
grafana:
  deploymentStrategy:
    type: RollingUpdate

  initChownData:
    enabled: false
  persistence:
    enabled: true
    storageClassName: longhorn # Grafana 영속화를 위해 longhorn 스토리지 클래스 사용
    size: 5Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: cledyu-ca
      mountPath: /etc/ssl/cledyu
      readOnly: true
  extraVolumes:
    - name: tmp
      emptyDir: {}
    - name: cledyu-ca
      configMap:
        name: cledyu-root-ca-bundle

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.loki.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000

    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3100
      isDefault: false
      jsonData:
        httpMethod: GET
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1m"
          spanEndTimeShift: "1m"
          filterByTraceID: true
          filterBySpanID: false
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # ── Keycloak OIDC ──
  # client_secret 은 env var (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET) 로 덮어쓴다.
  # Secret grafana-oidc(client-secret 키) 를 monitoring namespace 에 미리 생성해야 한다.
  grafana.ini:
    server:
      root_url: "https://grafana.cledyu.local"
    auth:
      disable_login_form: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak
      allow_sign_up: "true"
      auto_login: "false"
      client_id: grafana
      client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      scopes: "openid profile email"
      auth_url: https://keycloak.cledyu.local/realms/cledyu/protocol/openid-connect/auth
      token_url: https://keycloak.cledyu.local/realms/cledyu/protocol/openid-connect/token
      tls_client_ca: /etc/ssl/cledyu/ca.crt
      api_url: https://keycloak.cledyu.local/realms/cledyu/protocol/openid-connect/userinfo
      sign_out_redirect_url: "https://keycloak.cledyu.local/realms/cledyu/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https://grafana.cledyu.local/"
      role_attribute_path: "contains(groups[*], 'team-observability') && 'Admin' || contains(groups[*], 'team-platform') && 'Admin' || 'Viewer'"
      empty_scopes: "false"
      use_pkce: "true"

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "cledyu-ca"
    hosts:
      - grafana.cledyu.local
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.cledyu.local

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── kube-proxy ────────────────────────────────────────────────
# Cilium kube-proxy-replacement=true 로 실행 중이므로 kube-proxy pod 가 없음.
# scraping 비활성화하지 않으면 KubeProxyDown false alert 지속 발생.
kubeProxy:
  enabled: false

# ── node-exporter ─────────────────────────────────────────────
prometheus-node-exporter:
  hostNetwork: false # 노드의 실제 IP 메트릭이나 호스트 레벨의 상세 네트워크 통계가 필요하게 된다면 true 변경 필요
  hostPID: true

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

# ── kube-state-metrics ────────────────────────────────────────
kube-state-metrics:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Prometheus Operator ───────────────────────────────────────
prometheusOperator:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# lab 프로비저닝/스토리지/ArgoCD 재발 방지 알림.
# 핵심(lab-provisioning)은 kube-state-metrics(항상 수집)만 쓰므로 즉시 동작 — 이번 사고를 분 단위로 탐지.
# longhorn/argocd 그룹은 해당 메트릭 스크랩이 필요하며, 스크랩 누락 시 *MetricsAbsent 알림이 떠
# "모니터링 사각지대"가 조용히 생기지 않도록 한다.
additionalPrometheusRulesMap:
  lab-platform-health:
    groups:
      - name: lab-provisioning
        rules:
          - alert: LabBaseImageMissing
            expr: absent(kube_persistentvolumeclaim_status_phase{namespace="kubevirt", persistentvolumeclaim="ubuntu-2204-base", phase="Bound"} == 1)
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "lab base 이미지 PVC(ubuntu-2204-base)가 Bound 아님/부재"
              description: "세션 VM은 이 PVC를 클론한다. 부재 시 모든 세션 생성이 실패한다(과거 사고의 직접 원인)."
          - alert: LabProvisionCanaryFailing
            expr: |
              (time() - max(kube_cronjob_status_last_successful_time{namespace="kubevirt", cronjob="lab-provision-canary"})) > 2700
              or absent(kube_cronjob_status_last_successful_time{namespace="kubevirt", cronjob="lab-provision-canary"})
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "lab 프로비저닝 카나리가 최근 성공하지 못함"
              description: "base 이미지 클론(=세션 디스크 프로비저닝) 카나리가 45분 내 성공 기록이 없다. 프로비저닝 경로 장애 가능성."
      - name: longhorn-health
        rules:
          - alert: LonghornNodeUnschedulable
            expr: longhorn_node_status{condition="schedulable"} == 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Longhorn 노드 {{ $labels.node }} 스케줄 불가"
              description: "용량/예약 한도 초과 등으로 신규 볼륨 replica를 못 받는다. 누적 시 프로비저닝 전면 중단(과거 사고 유형)."
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness == 3
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "Longhorn 볼륨 {{ $labels.volume }} faulted"
              description: "replica가 전부 비정상 — 데이터/프로비저닝 영향."
          - alert: LonghornMetricsAbsent
            expr: absent(longhorn_node_status)
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Longhorn 메트릭 미수집(스크랩 누락 → Longhorn 알림 무력화)"
              description: "longhorn_node_status 시계열이 없다. longhorn-manager(9500/metrics) ServiceMonitor 또는 scrape 설정 필요."
      - name: argocd-health
        rules:
          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD 앱 {{ $labels.name }} OutOfSync 30분+ 지속"
              description: "drift 또는 sync 실패(과거 11일 sync hung 사고 유형). 확인 필요."
          - alert: ArgoCDAppUnhealthy
            expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD 앱 {{ $labels.name }} health={{ $labels.health_status }}"
              description: "앱이 비정상 health로 지속."
          - alert: ArgoCDMetricsAbsent
            expr: absent(argocd_app_info)
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "ArgoCD 메트릭 미수집(스크랩 누락 → ArgoCD 알림 무력화)"
              description: "argocd_app_info 시계열이 없다. argocd-application-controller metrics ServiceMonitor/scrape 설정 필요."
