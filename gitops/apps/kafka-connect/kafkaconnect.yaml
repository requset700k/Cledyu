---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: kafka
  labels:
    strimzi.io/cluster: cledyu-kafka
  annotations:
    # KafkaConnector CR로 커넥터를 관리하기 위해 필요
    strimzi.io/use-connector-resources: "true" # KafkaConnector CR로 커넥터를 관리하겠다는 선언, 없으면 Strimzi가 무시
    argocd.argoproj.io/sync-wave: "3"
spec:
  version: 3.8.0 # Kafka 브로커 버전과 통일
  replicas: 1 # Connect Pod 1개
  # BigQuery Sink 플러그인이 포함된 이미지를 직접 참조.
  # Strimzi build 블록을 쓰지 않는 이유:
  #   1. kafka 네임스페이스 PSA restricted 정책이 Kaniko(build Pod)를 차단
  #   2. 지정했던 Maven 아티팩트(com.wepay.kafka.connect:kafka-connect-bigquery:2.5.0)가 Maven Central에 없음
  # 이미지는 로컬에서 빌드 후 push 필요:
  #   docker build -t ghcr.io/requset700k/kafka-connect-bigquery:latest <Dockerfile 경로>
  #   docker push ghcr.io/requset700k/kafka-connect-bigquery:latest
  # TODO: 이미지 빌드 후 ghcr.io/requset700k/kafka-connect-bigquery:latest 로 push 필요
  image: ghcr.io/requset700k/kafka-connect-bigquery:latest
  bootstrapServers: cledyu-kafka-kafka-bootstrap.kafka.svc:9093

  tls:
    trustedCertificates:
      - secretName: cledyu-kafka-cluster-ca-cert
        certificate: ca.crt

  authentication:
    type: tls
    certificateAndKey:
      secretName: kafka-connect-kafka-client-tls
      certificate: tls.crt
      key: tls.key

  # ADC 파일(application_default_credentials.json)을 마운트하고 GOOGLE_APPLICATION_CREDENTIALS로 지정.
  # keyfile 설정 없이 Google Java SDK가 ADC를 자동으로 사용.
  externalConfiguration:
    volumes:
      - name: gcp-sa
        secret:
          secretName: kafka-connect-gcp-adc

  # Kafka Connect가 내부적으로 쓰는 세 토픽 (Kafka Connect가 처음 뜰 때 알아서 생성, kafkauser.yaml에 ACL로 정의)
  config:
    group.id: kafka-connect
    offset.storage.topic: kafka-connect-offsets
    config.storage.topic: kafka-connect-configs
    status.storage.topic: kafka-connect-status
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  template:
    pod:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    connectContainer:
      env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /opt/kafka/external-configuration/gcp-sa/key.json
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
