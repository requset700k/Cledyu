# Vault에 값을 넣는 건 ExternalSecret이 자동으로 못하니 수동 적용

# GCP 인증 파일 — Vault analytics/gcp-sa에서 동기화.
# kafkaconnect.yaml이 GOOGLE_APPLICATION_CREDENTIALS 환경변수로 이 파일을 참조,
# keyfile 설정 없이 Google Java SDK가 자동으로 인증에 사용.
#
# Vault에 등록하는 방법:
#   gcloud auth application-default login
#   vault kv put cledyu/analytics/gcp-sa \
#     key=@~/.config/gcloud/application_default_credentials.json

---
# External Secrets이 Vault에 저장된 시크릿을 주기적으로 읽어서 K8s Secret으로 자동 생성·갱신
# kafkaconnect.yaml에서 K8s Secret -> Pod 마운트를 담당

# kafka-connect-gcp-adc: BigQuery/GCS에 접근할 GCP ADC 파일을 Vault에서 가져와 K8s Secret에 저장한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-connect-gcp-adc
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h # 1시간마다 Vault에서 최신값 동기화
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-connect-gcp-adc
  data:
    - secretKey: key.json
      remoteRef:
        key: analytics/gcp-sa # Vault 이 경로에서
        property: key # key(Vault 안의 필드명)값을 가져옴
