# Vault에 값을 넣는 건 ExternalSecret이 자동으로 못하니 수동 적용

# GCP SA 키 — Vault analytics/gcp-sa에서 동기화.
# SA 키 파일 생성 (GCP에서 cledyu-analytics SA의 JSON 키 파일을 로컬에 생성)
# gcloud iam service-accounts keys create key.json --iam-account=cledyu-analytics@<project>.iam.gserviceaccount.com
# Vault에 저장 (@key.json = 파일 내용을 통째로 읽어서 Vault의 analytics/gcp-sa 경로에 key 필드로 저장)
# vault kv put cledyu/analytics/gcp-sa key=@key.json && rm key.json

# ghcr.io 토큰 등록 (ghcr.io push 자격증명 — Strimzi 빌드 시 플러그인 포함 이미지를 레지스트리에 push할 때 사용)
# GitHub PAT를 dockerconfigjson 형식으로 Vault에 저장
# vault kv put cledyu/registry/ghcr dockerconfigjson='{"auths":{"ghcr.io":{"username":"requset700k","password":"<GITHUB_TOKEN>"}}}'

---
# External Secrets이 Vault에 저장된 시크릿을 주기적으로 읽어서 K8s Secret으로 자동 생성·갱신
# kafkaconnect.yaml에서 K8s Secret -> Pod 마운트를 담당

# kafka-connect-gcp-sa: BigQuery/GCS에 접근할 GCP SA 키를 Vault에서 가져와 K8s Secret에 저장한다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-connect-gcp-sa
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h # 1시간마다 Vault에서 최신값 동기화
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-connect-gcp-sa
  data:
    - secretKey: key.json
      remoteRef:
        key: analytics/gcp-sa # Vault 이 경로에서
        property: key # key(Vault 안의 필드명)값을 가져옴
---

# kafka-connect-registry-credentials: Strimzi 빌드 시 플러그인 포함 이미지를 ghcr.io/requset700k/에 push할 때 필요한 정보를 담은 Secret
# kafkaconnect.yaml의 build.output.pushSecret이 참조해서 이미지 push할 때 인증에 사용
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-connect-registry-credentials
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-connect-registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson # 레지스트리 인증 전용 Secret 타입
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: registry/ghcr
        property: dockerconfigjson
