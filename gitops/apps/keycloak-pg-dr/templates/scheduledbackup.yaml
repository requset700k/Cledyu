## 복원된 DR 클러스터의 일 base backup(신 -dr 프리픽스). Cluster backup stanza(backupEnabled)에 종속되므로
## backupEnabled=false(default)면 렌더 안 함 — barmanObjectStore 없이 ScheduledBackup 만 있으면 실패하기 때문.
## real-DR post-failover 에서 backupEnabled=true 로 켜면 이 일 백업도 함께 활성.
## CNPG cron 은 6필드(초 분 시 일 월 요일). "0 0 3 * * *" = 매일 03:00:00(postgres-cnpg-dr 02:00 과 분리).
{{- if .Values.backupEnabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-pg-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 0 3 * * *"
  # immediate: 복원 직후 1회 base backup(복원점을 -dr 프리픽스에 즉시 확보).
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-pg
{{- end }}
