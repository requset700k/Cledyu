## keycloak-pg-credentials — managed.roles(cluster.yaml)의 password 소스이자 Keycloak(T8) DB 자격.
## EKS DR 엔 Ansible 이 돌지 않으므로(운영에선 keycloak_foundation 이 생성) 이 차트가 ESO 로 직접 만든다.
## Vault cledyu/keycloak/postgres(username/password) → ClusterSecretStore vault-backend(복원된 Vault).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-pg-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    # 부트스트랩 초기 Vault/CRD 미도달 시 dryrun 실패로 sync 가 막히지 않게.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG managed.roles 가 이 Secret 변경을 감지해 role password 를 재적용(ALTER ROLE)하려면
          # 이 라벨이 필요하다. 없으면 회전·재시드 시 Secret 만 바뀌고 DB role 은 옛 비번으로 남아 인증 붕괴.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/postgres
        property: password
