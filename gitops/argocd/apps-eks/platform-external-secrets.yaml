---
# External Secrets Operator — onprem platform-external-secrets.yaml 과 동일 패턴이나,
# ClusterSecretStore/ExternalSecret(Vault 연동, infra/kubernetes/external-secrets)은
# Task 6(Vault overlay) 범위 — 여기서는 오퍼레이터 자체만 배선한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-platform-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.14.3
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/apps/external-secrets/values.yaml
          - $values/gitops/apps/external-secrets/values-eks.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: feat/dr-eks-overlay   # 드릴 검증 후 main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata/finalizers
