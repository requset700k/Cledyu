---
# Vault — 온프렘 platform-vault.yaml 미러, 2곳 변경:
#  (1) valueFiles 를 values-awskms.yaml → values-eks.yaml(정적 크레드 배제, IRSA)
#  (2) directory include 에서 ingress.yaml/serverstransport.yaml 제외(Traefik CRD 없음, B5)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-platform-vault
  namespace: argocd
  annotations:
    # StatefulSet/vault 영구 OutOfSync 해소. syncOptions ServerSideApply=true 이면 API 서버가
    # volumeClaimTemplates 에 volumeMode:Filesystem·persistentVolumeClaimRetentionPolicy 를 defaulting 하는데,
    # 기본 client-side diff 는 git(그 필드 없음) vs live 를 drift 로 잡는다. ServerSideDiff 로 diff 도
    # 서버사이드 dry-run 하면 API 기본값이 predicted 에 포함돼 상쇄된다. (webhook 주입이 아니라 순수 API
    # defaulting 이므로 IncludeMutationWebhook 은 불필요 — CNPG -dr 앱과 원인이 다름.)
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.32.0
      helm:
        releaseName: vault
        valueFiles:
          - $values/gitops/apps/vault/values.yaml
          - $values/gitops/apps/vault/values-eks.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      path: gitops/apps/vault
      directory:
        include: "{namespace.yaml,admin-serviceaccount.yaml,certificate.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
