---
# CloudNativePG 오퍼레이터 — onprem data-cnpg-operator.yaml 과 동일 패턴(multi-source).
# sync-wave 0 — Cluster CR(Task 7, 이 태스크 범위 밖)보다 먼저 CRD·오퍼레이터가 서야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-data-cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.23.0
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/gitops/apps/cnpg-operator/values.yaml
          - $values/gitops/apps/cnpg-operator/values-eks.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: feat/dr-eks-overlay   # 드릴 검증 후 main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
