---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-kafka-cluster
  namespace: argocd
  annotations:
    # data-strimzi-operator(wave 0)가 CRD를 설치한 뒤 이 App이 sync되도록 순서 명시.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/cledyu.git
    targetRevision: main
    path: gitops/apps/kafka-cluster
    directory:
      recurse: true
      # EKS DR 전용 nodepool(gp3)은 온프렘에 배포하지 않는다 — 온프렘은 kafka-nodepool.yaml(longhorn) 사용.
      # (EKS data-kafka-cluster 는 반대로 longhorn 원본을 exclude 하고 kafka-nodepool-eks 를 include.)
      exclude: kafka-nodepool-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # KafkaNodePool / Kafka / KafkaTopic CRD는 data-strimzi-operator가 설치한다.
    # 최초 sync 시 CRD 전파 지연을 흡수하기 위해 retry 횟수를 높게 설정한다.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  # PVC prune 방지는 kafka-nodepool.yaml의 어노테이션으로 처리
  ignoreDifferences:
    - group: kafka.strimzi.io
      kind: Kafka
      jsonPointers:
        - /status
    - group: kafka.strimzi.io
      kind: KafkaTopic
      jsonPointers:
        - /status
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /status
    - group: cilium.io
      kind: CiliumIdentity
      jsonPointers:
        - /status
