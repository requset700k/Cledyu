apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/postgres
    helm:
      releaseName: postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres

  syncPolicy:
    automated:
      # DB StatefulSet/PVC 는 실수 삭제의 파급이 커서 prune 은 켜되 selfHeal 과 함께
      # 다른 data-* 앱과 동일 정책을 유지한다(복구는 Velero 백업 — RPO 1h).
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
