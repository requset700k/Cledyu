apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/postgres
    helm:
      releaseName: postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres

  # StatefulSet 의 persistentVolumeClaimRetentionPolicy 와 volumeClaimTemplates[].volumeMode 는
  # helm 템플릿에 없고 API server 가 기본값(Retain/Retain, Filesystem)을 채운다. argocd diff 는
  # 정규화로 숨기지만 sync-status 는 이를 세어 상시 OutOfSync 였고, volumeClaimTemplates 는
  # immutable 이라 sync 로도 못 고친다. server 가 소유하는 이 기본값 필드만 무시한다.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgres
      namespace: postgres
      jqPathExpressions:
        - '.spec.persistentVolumeClaimRetentionPolicy'
        - '.spec.volumeClaimTemplates[].spec.volumeMode'

  syncPolicy:
    automated:
      # DB StatefulSet/PVC 는 실수 삭제의 파급이 커서 prune 은 켜되 selfHeal 과 함께
      # 다른 data-* 앱과 동일 정책을 유지한다(복구는 Velero 백업 — RPO 1h).
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
