apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres
  namespace: argocd
  annotations:
    # postgres StatefulSet 이 kubectl 서버 diff(=실제 apply dry-run)는 0 인데도 ArgoCD client-side
    # diff 가 상시 OutOfSync 로 표시(volumeClaimTemplates 의 SSA diff 불일치, 알려진 케이스). diff 를
    # 서버 dry-run 으로 계산하게 해 실제 클러스터 상태와 일치시킨다(ArgoCD 2.13, sync 동작엔 영향 없음).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/postgres
    helm:
      releaseName: postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres

  syncPolicy:
    automated:
      # DB StatefulSet/PVC 는 실수 삭제의 파급이 커서 prune 은 켜되 selfHeal 과 함께
      # 다른 data-* 앱과 동일 정책을 유지한다(복구는 Velero 백업 — RPO 1h).
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
