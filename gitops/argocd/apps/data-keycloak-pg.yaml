apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-keycloak-pg
  namespace: argocd
  annotations:
    # 오퍼레이터(data-cnpg-operator, wave 0) 이후 Cluster CR이 서도록 wave 1.
    argocd.argoproj.io/sync-wave: "1"
    # CNPG mutating webhook 기본값을 diff에서 정규화(영구 OutOfSync 방지). ServerSideApply와 짝.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/keycloak-pg
    helm:
      releaseName: keycloak-pg
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  # 이관 완료(Task 4 cutover·G1·G2·G3 통과) — automated 전환. 이관 중에는 수동 sync였다:
  # 자동 sync면 커밋 즉시 ArgoCD가 Cluster를 만들어 아직 안 멈춘 구 DB를 import → write-freeze 무의미.
  # selfHeal 안전 조건: Cluster 삭제→재생성 시 initdb.import가 재실행될 수 있으나, 소스인 구 Bitnami
  # DB(keycloak-db-postgresql)를 replicas 0으로 정지해 접속 불가 → stale 데이터 조용한 부활 대신
  # 시끄러운 실패(fail-safe). 구 DB 폐기(Task 6) 전까지 이 정지 상태를 되돌리지 말 것.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
