apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-keycloak-pg
  namespace: argocd
  annotations:
    # 오퍼레이터(data-cnpg-operator, wave 0) 이후 Cluster CR이 서도록 wave 1.
    argocd.argoproj.io/sync-wave: "1"
    # CNPG mutating webhook 기본값을 diff에서 정규화(영구 OutOfSync 방지). ServerSideApply와 짝.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/keycloak-pg
    helm:
      releaseName: keycloak-pg
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  # 이관 완료(Task 4 cutover·G1·G2·G3 통과) — automated 전환. 이관 중에는 수동 sync였다:
  # 자동 sync면 커밋 즉시 ArgoCD가 Cluster를 만들어 아직 안 멈춘 구 DB를 import → write-freeze 무의미.
  # bootstrap.initdb.import는 이미 생성된 Cluster에 재실행되지 않으므로 automated로 되돌려도 안전.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
