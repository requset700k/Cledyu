apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-keycloak-pg
  namespace: argocd
  annotations:
    # 오퍼레이터(data-cnpg-operator, wave 0) 이후 Cluster CR이 서도록 wave 1.
    argocd.argoproj.io/sync-wave: "1"
    # CNPG mutating webhook 기본값을 diff에서 정규화(영구 OutOfSync 방지). ServerSideApply와 짝.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/keycloak-pg
    helm:
      releaseName: keycloak-pg
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  # 이관 중: automated 없음(수동 sync). 자동 sync면 커밋 즉시 ArgoCD가 Cluster를 만들어 아직 안 멈춘
  # 구 DB를 import → write-freeze 무의미. cutover 검증 후 Task 4에서 git으로 automated 블록 추가.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
