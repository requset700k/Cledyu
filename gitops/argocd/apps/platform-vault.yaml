---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.32.0
      helm:
        releaseName: vault
        valueFiles:
          - $values/gitops/apps/vault/values.yaml
          # AWS KMS auto-unseal 마이그레이션 단계 — awskms(active) + gcpckms{disabled}.
          # 유지보수 창에서 파드 재시작 → 노드별 unseal-migrate 로 재래핑(런북 참고).
          # 마이그레이션 완료 후 별도 PR 로 gcpckms{disabled}+GCP creds 제거 → awskms 단독.
          - $values/gitops/apps/vault/values-awskms.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      path: gitops/apps/vault
      directory:
        include: "{namespace.yaml,admin-serviceaccount.yaml,certificate.yaml,serverstransport.yaml,ingress.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
