---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kubevirt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/cledyu.git
    targetRevision: main
    path: gitops/apps/kubevirt
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  # CDI operator 가 cdis CRD 의 스키마(versions)를 런타임에 소유·관리한다. git 의 cdi-operator.yaml
  # 번들 CRD 와 버전 목록이 달라(operator 가 v1alpha1 등을 정리) 상시 OutOfSync 였다 — operator 소유
  # 필드는 무시한다. (ubuntu preference 충돌은 preferences.yaml 을 cledyu-ubuntu 로 rename 해 해소)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
      jqPathExpressions:
        - '.spec.versions'
        - '.spec.conversion'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # in-sync 리소스는 sync 때 재적용하지 않는다. base-datavolume 의 Force=true(delete+recreate)가
      # cdis CRD·ubuntu preference 의 상시 드리프트 복구 sync 때마다 트리거되어 base PVC 가 수시로
      # 재생성되는 것을 막는다 — Force 는 DataVolume 이 실제 OutOfSync(재베이크 태그 bump) 일 때만 작동.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
