---
# CloudNativePG 오퍼레이터를 ArgoCD로 배포(멀티소스: upstream 차트 + $values).
# sync-wave 0 — Cluster CR(data-postgres-cnpg)보다 먼저 CRD·오퍼레이터가 서야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1) cloudnative-pg 공식 Helm 차트 (버전 고정).
    #    chart 0.26.1 = operator 1.27.1. 0.23.0(=1.25.0)에서 상향한 이유:
    #    Keycloak DB(Bitnami)가 PostgreSQL 18이라 CNPG 논리 import(target≥source)에 PG 18 지원이
    #    필요한데, PG 18은 operator 1.25.4/1.26.2/1.27.1(2025-10 배치)부터다. 공식 차트가 1.25.2~1.25.4·
    #    1.26.2를 안 내서, PG 18 지원 + 차트 존재하는 최소 버전이 1.27.1(chart 0.26.1)이다.
    #    in-tree spec.backup.barmanObjectStore는 1.26부터 deprecated이나 1.27에서도 기본·정상 동작 →
    #    cledyu-pg/keycloak-pg 백업 설정 그대로 유지(barman-cloud 플러그인 이관 불필요, 후속 과제).
    #    Cluster의 monitoring.enablePodMonitor도 1.27에서 deprecated지만 존재·동작(수동 PodMonitor 이관은 후속).
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.26.1
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/gitops/apps/cnpg-operator/values.yaml
    # 2) values.yaml 제공 Git 레포 (ref: values)
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # 대형 CRD annotation 초과 방지
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
