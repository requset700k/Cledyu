---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sloth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://slok.github.io/sloth
      chart: sloth
      targetRevision: 0.16.0
      helm:
        releaseName: sloth
        valueFiles:
          - $values/gitops/apps/sloth/values.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      path: gitops/apps/sloth
      directory:
        # values.yaml 은 helm $values 소스로만 쓰이므로 매니페스트 적용 대상에서 제외한다.
        # Sloth CRD 와 SLO CR 들을 GitOps 로 관리하기 위해 명시 목록으로 포함한다.
        include: "{namespace.yaml,crds.yaml,kubevirt-slo.yaml,kafka-slo.yaml,traefik-slo.yaml,lab-slo.yaml,api-slo.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: sloth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
