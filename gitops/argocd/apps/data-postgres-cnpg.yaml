apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres-cnpg
  namespace: argocd
  annotations:
    # 오퍼레이터(data-cnpg-operator, wave 0) 이후에 Cluster CR이 서도록 wave 1.
    argocd.argoproj.io/sync-wave: "1"
    # CNPG defaulting(mutating) webhook이 Cluster spec에 채우는 기본값(postgresql.parameters,
    # affinity, replicationSlots, enablePDB, *Delay, storage.resizeInUseVolumes 등)은 git엔 없어서
    # client-side diff가 이를 drift로 잡아 영구 OutOfSync가 된다(selfHeal도 못 지움 — 재-defaulting).
    # ServerSideDiff는 dry-run SSA로 diff를 계산해 그 기본값을 정규화 제거한다. 단 ArgoCD는 기본적으로
    # mutation webhook이 주입한 변경을 diff에서 제외하므로, webhook이 채운 이 값들까지 상쇄하려면
    # IncludeMutationWebhook=true 를 함께 켜야 한다(안 켜면 predicted에 기본값이 빠져 여전히 OutOfSync).
    # (ArgoCD 2.10+ 필요. ServerSideApply=true 와 짝.)
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  source:
    repoURL: https://github.com/requset700k/Cledyu.git
    targetRevision: main
    path: gitops/apps/postgres-cnpg
    helm:
      releaseName: postgres-cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres

  # 이관 완료(2026-07-07, Plan A Task 4 Step 5~9 전부 통과: G1 row count 일치, G3 S3 백업 도달, api cutover 성공 확인) — automated로 전환
  # 런타임 `argocd app set`이 아니라 이 파일을 git으로 수정한다.(root-apps의 selfHeal이 자식 spec을 git과 강제 일치시켜 런타임 토글은 복원 시 되돌려짐)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
