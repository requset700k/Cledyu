---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 69.3.2
      helm:
        releaseName: kps
        valueFiles:
          - $values/gitops/apps/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/requset700k/Cledyu.git
      targetRevision: main
      path: infra/kubernetes/monitoring
      directory:
        include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # cledyu-root-ca-bundle ConfigMap 의 data 는 trust-manager 가 소유(trust.cert-manager.io/hash)하며
  # ca.crt 를 trailing newline 없이 기록한다. git 정적 CM 과 newline 만 달라 상시 OutOfSync 였다 —
  # 컨트롤러가 소유하는 data 는 무시한다(정적 CM 은 mount 보장용 seed).
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cledyu-root-ca-bundle
      namespace: monitoring
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
