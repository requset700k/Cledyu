# Cledyu 로그인 테마 — classic Keycloak 테마 상속 후 web과 같은 monochrome 브랜딩 오버라이드.
# parent=keycloak 의 구조(폼/알림 macro)는 재사용하고, 외형은 css/cledyu.css 로 전부 덮는다.
parent=keycloak
import=common/keycloak

# keycloak 기본 스타일 위에 cledyu.css 를 마지막에 얹어 오버라이드(뒤 항목 우선).
styles=css/login.css css/cledyu.css

# 한국어 우선(realm locale 설정과 정렬). 영어 폴백 유지.
locales=ko,en
