---
# api 의 PostgreSQL 접속 DSN 을 Vault → ESO 로 주입한다. DSN 에 비밀번호가 포함되므로
# 값 전체를 시크릿으로 다룬다(개별 필드 조합 대신 단일 키 — 회전 시 한 곳만 갱신).
#   Vault `cledyu/db/api:dsn` (KV mount=cledyu)
#   → 이 ExternalSecret → Secret cledyu-api-db.dsn
#   → api Deployment env CLEDYU_DB_DSN
# 등록 예: vault kv put cledyu/db/api dsn='postgres://cledyu:<pw>@postgres.postgres.svc:5432/cledyu'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-db
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: dsn
      remoteRef:
        key: db/api
        property: dsn
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
