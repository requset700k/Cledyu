---
# validation-engine 의 AWS SSM 채점 자격증명을 Vault → ESO 로 주입한다.
# 엔진은 EC2 세션을 SSM(SendCommand/GetCommandInvocation)으로 채점하는 최소권한 키만 쓴다
# (api 의 EC2 수명주기 키와 분리 — 권한 격리). 리전은 검증 요청 VM spec 에서 온다(env 불필요).
#   Vault `cledyu/aws/validation-engine` (KV mount=cledyu): access_key_id, secret_access_key
#   → 이 ExternalSecret → Secret cledyu-validation-engine-aws
#   → validation-engine Deployment env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# 등록 예:
#   vault kv put cledyu/aws/validation-engine access_key_id=AKIA... secret_access_key=...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-validation-engine-aws
  namespace: validation-engine
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-validation-engine-aws
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access_key_id
      remoteRef:
        key: aws/validation-engine
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: aws/validation-engine
        property: secret_access_key
