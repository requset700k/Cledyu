---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    # ESO 가 argocd-secret 에 source ExternalSecret 의 ArgoCD tracking 라벨
    # (argocd.argoproj.io/instance: platform-external-secrets) 을 전파하면,
    # ArgoCD 가 argocd-secret 을 platform-external-secrets app 소속으로 오인 →
    # git desired state 에 없으므로 prune sync 가 삭제 → argocd-server CrashLoop.
    # template.metadata 로 instance 라벨을 argocd(self-managed app)로 고정해
    # 소유권을 명확히 하고 prune 대상에서 제외한다.
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/instance: argocd
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef:
        key: oidc/argocd
        property: client_secret
        # ESO 가 reconcile 시 remoteRef 에 자동 주입하는 default 값들을 명시.
        # git 에 없으면 ArgoCD 가 live(ESO 주입)와 desired(git) 를 diff 로 보아
        # 영구 OutOfSync → self-heal 무한 반복. 명시해서 diff 를 제거한다.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
