---
# 라이브 터미널 Tailscale 키 — DR 부트스트랩 시드 키.
# EC2 라이브 터미널 광고(session.go)는 (1) 세션 EC2 의 tailnet 가입(session.TailnetEnabled — 정적
# tailscale_authkey 또는 동적발급 tailscale_api_key 로 가입)과 (2) api 파드 자신의 tsnet 가입
# (api_tailscale_authkey → ec2Dial 주입) 이 모두 있어야 한다.
#   - api_tailscale_authkey : api 파드 tsnet 가입(tag:cledyu-api). 모든 구성에서 필수.
#   - 세션 키(둘 중 하나):
#       * tailscale_authkey  : 세션 EC2 cloud-init 의 tailscale up(ephemeral, tag:lab-ec2). 정적/폴백.
#       * tailscale_api_key(+tailscale_oauth_client_id) : 세션마다 one-off 동적발급(issue #307, 권장).
# ⚠️ 라이브 터미널은 DR 실습에 필요하다(사용자가 브라우저 터미널로 EC2 세션에 명령 입력). 없으면 채점은
#    되지만 실습을 못 하므로 사실상 필수 → 필요한 키를 Vault(cledyu/aws/api)에 부트스트랩 시 시드한다.
# ⚠️ 필수 AWS 키(cledyu-api-aws)와는 분리한다(Codex P1·P2): 어느 터미널 키든 미시드로 Degraded 여도 필수
#    AWS 키 동기화는 막지 않아 api 는 정상 기동한다(미시드 Degraded = '필수 키 시드 누락' 신호, 가짜 노이즈 아님).
#    deployment 의 터미널 env 는 optional:true(파드 방어) — 그래도 시드가 정석.
# ⚠️ ESO 규칙: data 항목은 Vault property 가 시드된 것만 둔다. 미시드 property 를 참조하면 ES 전체가
#    SyncError 로 빠져 다른 키 동기화까지 막힌다 → data 항목 존재 ⟺ 해당 Vault property 시드됨(아래 절 참고).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-tailscale
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-tailscale
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tailscale_authkey
      remoteRef:
        key: aws/api
        property: tailscale_authkey
    - secretKey: api_tailscale_authkey
      remoteRef:
        key: aws/api
        property: api_tailscale_authkey
    # 세션 키 구성 (택1 — 규칙: data 항목 존재 ⟺ Vault property 시드됨. 항상 Vault 시드 먼저, 그다음 주석):
    #  (a) 정적만(현행): 위 tailscale_authkey 만 둔다. 동적 미사용.
    #  (b) 정적+동적 폴백: 위 tailscale_authkey 유지 + 아래 tailscale_api_key 주석 해제. 둘 다 시드돼 있어
    #      ES 안전(동적 발급 실패 시 세션은 fail-secure — 정적으로 폴백하진 않음).
    #  (c) 동적 전용(정적 키 완전 제거): 아래 tailscale_api_key 주석 해제 + Vault 에서 tailscale_authkey
    #      property 삭제 + **위 tailscale_authkey data 항목도 함께 주석 처리**한다. (미시드 property 를
    #      참조한 채 두면 ES 전체 SyncError → tailscale_api_key 까지 동기화 실패.)
    #
    # (issue #307) 동적발급 활성화: Vault cledyu/aws/api 에 property tailscale_api_key 를 먼저 넣은 뒤
    # 아래 항목의 주석을 해제한다. 순서(시드→주석해제)를 지켜 SyncError 를 피한다.
    # 2026-07-15 활성화: Vault 시드 완료(personal API access token 직접 Bearer 방식, OAuth 미사용).
    - secretKey: tailscale_api_key
      remoteRef:
        key: aws/api
        property: tailscale_api_key
    # tailscale_api_key 가 OAuth client secret 이면 client id 도 함께 주입한다(코드가 토큰 교환).
    # API 액세스 토큰을 직접 쓰는 경우엔 불필요. 마찬가지로 Vault 시드 후 주석 해제.
    # - secretKey: tailscale_oauth_client_id
    #   remoteRef:
    #     key: aws/api
    #     property: tailscale_oauth_client_id
