---
# api 파드 자신의 tsnet(라이브 터미널) authkey — DR 부트스트랩 필수 시드 키.
# ⚠️ 라이브 터미널은 DR 실습에 필요하다(사용자가 브라우저 터미널로 EC2 세션에 명령 입력). 없으면 채점은
#    되지만 사용자가 실습을 못 하므로 사실상 필수 → api_tailscale_authkey 를 Vault(cledyu/aws/api)에
#    부트스트랩 시 시드하는 것을 전제로 한다(런북 사전 시드 목록). 시드되면 이 ExternalSecret 은 Healthy.
# ⚠️ 필수 AWS 키(cledyu-api-aws)와는 분리한다(Codex P1): 여기가 미시드로 Degraded 여도 필수 AWS 키
#    동기화는 막지 않아 api 는 정상 기동한다(미시드 Degraded = '필수 키 시드 누락' 신호, 가짜 노이즈 아님).
#    deployment 의 CLEDYU_AWS_API_TAILSCALE_AUTH_KEY 는 optional:true(파드 방어) — 그래도 시드가 정석.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-tailscale
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-tailscale
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_tailscale_authkey
      remoteRef:
        key: aws/api
        property: api_tailscale_authkey
