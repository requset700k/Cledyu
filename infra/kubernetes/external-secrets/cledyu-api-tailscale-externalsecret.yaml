---
# 라이브 터미널 Tailscale authkey 2종 — DR 부트스트랩 필수 시드 키.
# terminal_url 광고(session.go)는 두 키가 모두 있어야 한다(TailscaleAuthKey != "" && ec2Dial != nil):
#   - tailscale_authkey     : 세션 EC2 인스턴스가 cloud-init 의 tailscale up 으로 tailnet 에 가입(ephemeral, tag:lab-ec2).
#   - api_tailscale_authkey : api 파드 자신이 tsnet 으로 tailnet 에 가입(tag:cledyu-api) → ec2Dial 주입.
# ⚠️ 라이브 터미널은 DR 실습에 필요하다(사용자가 브라우저 터미널로 EC2 세션에 명령 입력). 없으면 채점은
#    되지만 사용자가 실습을 못 하므로 사실상 필수 → 두 키 모두 Vault(cledyu/aws/api)에
#    부트스트랩 시 시드하는 것을 전제로 한다(런북 사전 시드 목록). 시드되면 이 ExternalSecret 은 Healthy.
# ⚠️ 필수 AWS 키(cledyu-api-aws)와는 분리한다(Codex P1·P2): 어느 터미널 키든 미시드로 Degraded 여도 필수
#    AWS 키 동기화는 막지 않아 api 는 정상 기동한다(미시드 Degraded = '필수 키 시드 누락' 신호, 가짜 노이즈 아님).
#    tailscale_authkey 가 cledyu-api-aws 의 필수 ref 로 남아 있으면 미시드 시 그 Secret 자체가 안 만들어져
#    AWS_ACCESS_KEY_ID(non-optional) 마운트 실패 → api 파드 기동 차단이었다(Codex P2) — 그래서 이쪽으로 옮겼다.
#    deployment 의 두 env 는 optional:true(파드 방어) — 그래도 시드가 정석.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-tailscale
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-tailscale
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tailscale_authkey
      remoteRef:
        key: aws/api
        property: tailscale_authkey
    - secretKey: api_tailscale_authkey
      remoteRef:
        key: aws/api
        property: api_tailscale_authkey
    # (issue #307) 세션별 one-off authkey 동적발급 활성화 시, Vault cledyu/aws/api 에 property
    # tailscale_api_key 를 먼저 넣은 뒤 아래 항목의 주석을 해제한다. Vault 에 없는 property 를 먼저
    # 추가하면 이 ExternalSecret 전체가 SyncError 로 빠지므로(다른 키 동기화 저해) 순서를 지킨다.
    # - secretKey: tailscale_api_key
    #   remoteRef:
    #     key: aws/api
    #     property: tailscale_api_key
