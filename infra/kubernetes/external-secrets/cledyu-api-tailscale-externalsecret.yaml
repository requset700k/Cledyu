---
# api 파드 자신의 tsnet(라이브 터미널) authkey — 선택(optional) 키라서 필수 AWS 키(cledyu-api-aws)와 분리한다.
# ⚠️ 분리 이유(Codex P1): 이 property 가 Vault(aws/api)에 없으면 ExternalSecret 이 동기화 실패하는데,
#    필수 AWS 키와 같은 ExternalSecret 에 두면 그 실패가 AWS_ACCESS_KEY_ID/SECRET 까지 막아 api 파드가 안 뜬다.
#    별도 시크릿으로 빼서, 이 키가 없으면 이 시크릿만 실패(라이브 터미널만 비활성)하고 api 는 정상 기동한다.
#    (deployment 의 CLEDYU_AWS_API_TAILSCALE_AUTH_KEY 는 optional:true 라 이 Secret 부재도 허용.)
# 전제: Vault cledyu/aws/api 에 api_tailscale_authkey(ephemeral, tag:cledyu-api) 시드 시 활성.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-tailscale
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-tailscale
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_tailscale_authkey
      remoteRef:
        key: aws/api
        property: api_tailscale_authkey
