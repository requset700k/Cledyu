---
# cledyu-learn realm 의 web(confidential, BFF) client secret 을 Vault → ESO 로
# api Deployment 에 주입한다. 회전 절차/소스 오브 트루스는 argocd-oidc 와 동일 패턴:
#   Vault `cledyu/oidc/cledyu-web:client_secret` (KV mount=cledyu; Terraform learn_oidc_client_secrets.web)
#   → 이 ExternalSecret → Secret cledyu-api-oidc.client_secret
#   → api Deployment env CLEDYU_KEYCLOAK_CLIENT_SECRET
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-web-oidc-client-secret
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_secret
      remoteRef:
        key: oidc/cledyu-web
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
