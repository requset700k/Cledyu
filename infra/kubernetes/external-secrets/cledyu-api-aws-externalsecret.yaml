---
# api 의 AWS EC2 오버플로우 자격증명 + Tailscale authkey 를 Vault → ESO 로 주입한다.
# api 는 EC2 인스턴스 수명주기(RunInstances/Terminate/Describe)를 다루는 최소권한 키를 쓴다
# (검증엔진과 분리 — cledyu-validation-engine-aws). Tailscale authkey 는 세션 인스턴스 cloud-init 의
# tailscale up 에 쓰인다(ephemeral, tag:lab-ec2 권장).
#   Vault `cledyu/aws/api` (KV mount=cledyu): access_key_id, secret_access_key, tailscale_authkey
#   → 이 ExternalSecret → Secret cledyu-api-aws
#   → api Deployment env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / CLEDYU_AWS_TAILSCALE_AUTH_KEY
# 등록 예:
#   vault kv put cledyu/aws/api \
#     access_key_id=AKIA... secret_access_key=... tailscale_authkey=tskey-auth-...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-api-aws
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-aws
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access_key_id
      remoteRef:
        key: aws/api
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: aws/api
        property: secret_access_key
    - secretKey: tailscale_authkey
      remoteRef:
        key: aws/api
        property: tailscale_authkey
