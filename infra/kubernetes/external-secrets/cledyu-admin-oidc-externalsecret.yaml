---
# 역할 승격 service-account(cledyu-admin) client secret 을 Vault → ESO 로 주입한다.
# 이 클라이언트는 realm-management 의 manage-users·view-realm 역할이 부여된 confidential
# client(service account 활성)여야 한다 — 설정은 런북 learner-auth.md §6.2 참고.
#   Vault `cledyu/oidc/cledyu-admin:client_secret` (KV mount=cledyu)
#   → 이 ExternalSecret → Secret cledyu-api-admin-oidc.client_secret
#   → api Deployment env CLEDYU_KEYCLOAK_ADMIN_CLIENT_SECRET
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cledyu-admin-oidc-client-secret
  namespace: api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cledyu-api-admin-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_secret
      remoteRef:
        key: oidc/cledyu-admin
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
