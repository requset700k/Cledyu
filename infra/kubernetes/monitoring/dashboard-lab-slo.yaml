apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-lab-slo
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  dashboard-lab-slo-overview.json: |
    {
      "title": "Lab SLO Dashboard",
      "uid": "lab-slo-overview-cledyu",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "1m",
      "style": "dark",
      "tags": [
        "lab",
        "slo",
        "sloth",
        "platform"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "env",
            "type": "custom",
            "query": "onprem,ec2",
            "current": {
              "text": "onprem",
              "value": "onprem"
            },
            "includeAll": true,
            "allValue": ".*",
            "label": "Lab env"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "SLO Summary",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "gauge",
          "title": "Lab Startup Success Rate",
          "id": 2,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "1 - ((sum(rate(lab_start_total{env=~\"$env\",result!=\"success\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(lab_start_total{env=~\"$env\"}[$__rate_interval])), 0.000001))",
              "legendFormat": "startup success",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Onprem Startup p95",
          "id": 3,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 420
                  },
                  {
                    "color": "red",
                    "value": 600
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lab_startup_duration_seconds_bucket{env=\"onprem\",result=\"success\"}[$__rate_interval])))",
              "legendFormat": "onprem p95",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "EC2 Startup p95",
          "id": 4,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 600
                  },
                  {
                    "color": "red",
                    "value": 900
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lab_startup_duration_seconds_bucket{env=\"ec2\",result=\"success\"}[$__rate_interval])))",
              "legendFormat": "ec2 p95",
              "refId": "A"
            }
          ]
        },
        {
          "type": "gauge",
          "title": "VM Boot Success Rate",
          "id": 5,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.995
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "expr": "1 - ((sum(rate(vm_boot_total{result=\"failed\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(vm_boot_total[$__rate_interval])), 0.000001))",
              "legendFormat": "vm boot success",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Startup Details",
          "collapsed": false,
          "id": 10,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          }
        },
        {
          "type": "timeseries",
          "title": "Lab Startup Duration by Env",
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, env) (rate(lab_startup_duration_seconds_bucket{env=~\"$env\",result=\"success\"}[$__rate_interval])))",
              "legendFormat": "{{env}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, env) (rate(lab_startup_duration_seconds_bucket{env=~\"$env\",result=\"success\"}[$__rate_interval])))",
              "legendFormat": "{{env}} p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, env) (rate(lab_startup_duration_seconds_bucket{env=~\"$env\",result=\"success\"}[$__rate_interval])))",
              "legendFormat": "{{env}} p99",
              "refId": "C"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Lab Start Results",
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "ops",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (env, result, reason) (increase(lab_start_total{env=~\"$env\"}[$__rate_interval]))",
              "legendFormat": "{{env}} {{result}} {{reason}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Interactive Paths",
          "collapsed": false,
          "id": 20,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          }
        },
        {
          "type": "timeseries",
          "title": "WebSocket Error Drop Rate",
          "id": 21,
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "percentunit",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.03
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(ws_connection_drop_total{result=\"error\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(ws_connection_established_total[$__rate_interval])), 0.000001)",
              "legendFormat": "error drops",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation Latency",
          "id": 22,
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(validation_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(validation_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AI Hint Latency",
          "id": 23,
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ai_hint_latency_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(ai_hint_latency_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "B"
            }
          ]
        },
        {
          "type": "row",
          "title": "Sloth Error Budgets",
          "collapsed": false,
          "id": 30,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          }
        },
        {
          "type": "bargauge",
          "title": "Lab SLO Error Budget Remaining",
          "id": 31,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            }
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showUnfilled": true
          },
          "targets": [
            {
              "expr": "avg by (sloth_slo) (slo:period_error_budget_remaining:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"} unless slo:period_error_budget_remaining:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"} != slo:period_error_budget_remaining:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"})",
              "legendFormat": "{{sloth_slo}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Lab SLO Burn Rate",
          "id": 32,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 8,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "showPoints": "always",
                "spanNulls": true
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "avg by (sloth_slo) (slo:current_burn_rate:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"} unless slo:current_burn_rate:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"} != slo:current_burn_rate:ratio{sloth_service=\"lab\",sloth_slo=~\"lab-startup-onprem|lab-startup-ec2|lab-start-success-rate|vm-boot-success-rate|websocket-stability|validation-latency|ai-hint-latency\"})",
              "legendFormat": "{{sloth_slo}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
