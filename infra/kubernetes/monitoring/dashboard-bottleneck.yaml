---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-bottleneck
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  dashboard-bottleneck.json: |
    {
      "title": "Cledyu API Tempo Bottleneck",
      "uid": "cledyu-bottleneck-overview",
      "schemaVersion": 36,
      "version": 4,
      "refresh": "30s",
      "style": "dark",
      "tags": [
        "cledyu",
        "api",
        "bottleneck",
        "tempo"
      ],
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "route",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(http_requests_total, path)",
            "label": "API route",
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Open Tempo Explore",
          "type": "link",
          "url": "/explore?left={\"datasource\":\"tempo\",\"queries\":[{\"queryType\":\"nativeSearch\",\"serviceName\":\"cledyu-api\"}],\"range\":{\"from\":\"now-3h\",\"to\":\"now\"}}",
          "targetBlank": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "API Overview",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "API request rate",
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "requests",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API p95 latency",
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 1.5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API p99 latency",
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1.2
                  },
                  {
                    "color": "red",
                    "value": 2.5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API 5xx rate",
          "id": 5,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{path=~\"$route\",status=~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(http_requests_total{path=~\"$route\"}[$__rate_interval])), 0.001)",
              "legendFormat": "5xx",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API latency by route",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "{{path}} p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "{{path}} p99",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API request and error rate",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (path) (rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "{{path}} all",
              "refId": "A"
            },
            {
              "expr": "sum by (path) (rate(http_requests_total{path=~\"$route\",status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "{{path}} 5xx",
              "refId": "B"
            }
          ]
        },
        {
          "type": "table",
          "title": "Slowest API routes",
          "id": 8,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval]))))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API status code rate",
          "id": 9,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "API Internal Operations",
          "collapsed": false,
          "id": 10,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          }
        },
        {
          "type": "timeseries",
          "title": "Validation latency",
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, result) (increase(validation_duration_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, result) (increase(validation_duration_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p95",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AI hint latency",
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, result) (increase(ai_hint_latency_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, result) (increase(ai_hint_latency_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p95",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation result throughput",
          "id": 13,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (result) (increase(validation_duration_seconds_count[15m]))",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AI hint result throughput",
          "id": 14,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (result) (increase(ai_hint_latency_seconds_count[15m]))",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
