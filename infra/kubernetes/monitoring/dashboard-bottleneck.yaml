---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-bottleneck
  namespace: monitoring
  labels:
    app: kube-prometheus-stack-grafana
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  dashboard-bottleneck.json: |
    {
      "title": "Cledyu API & Validation Tempo Bottleneck",
      "uid": "cledyu-bottleneck-overview",
      "schemaVersion": 36,
      "version": 6,
      "refresh": "30s",
      "style": "dark",
      "tags": [
        "cledyu",
        "api",
        "validation-engine",
        "bottleneck",
        "tempo"
      ],
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "route",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(http_requests_total, path)",
            "label": "API route",
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Open Tempo Explore",
          "type": "link",
          "url": "/explore?left={\"datasource\":\"tempo\",\"queries\":[{\"queryType\":\"nativeSearch\",\"serviceName\":\"cledyu-api\"}],\"range\":{\"from\":\"now-3h\",\"to\":\"now\"}}",
          "targetBlank": true,
          "includeVars": false,
          "keepTime": true
        },
        {
          "title": "Open validation-engine traces",
          "type": "link",
          "url": "/explore?left={\"datasource\":\"tempo\",\"queries\":[{\"queryType\":\"traceql\",\"query\":\"{ resource.service.name = \\\"validation-engine\\\" }\"}],\"range\":{\"from\":\"now-3h\",\"to\":\"now\"}}",
          "targetBlank": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "API Overview",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "API request rate",
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "requests",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API p95 latency",
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 1.5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API p99 latency",
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1.2
                  },
                  {
                    "color": "red",
                    "value": 2.5
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "API 5xx rate",
          "id": 5,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{path=~\"$route\",status=~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(http_requests_total{path=~\"$route\"}[$__rate_interval])), 0.001)",
              "legendFormat": "5xx",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API latency by route",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "{{path}} p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval])))",
              "legendFormat": "{{path}} p99",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API request and error rate",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (path) (rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "{{path}} all",
              "refId": "A"
            },
            {
              "expr": "sum by (path) (rate(http_requests_total{path=~\"$route\",status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "{{path}} 5xx",
              "refId": "B"
            }
          ]
        },
        {
          "type": "table",
          "title": "Slowest API routes",
          "id": 8,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{path=~\"$route\"}[$__rate_interval]))))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "API status code rate",
          "id": 9,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{path=~\"$route\"}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "API Internal Operations",
          "collapsed": false,
          "id": 10,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          }
        },
        {
          "type": "row",
          "title": "Kafka Validation Flow",
          "collapsed": false,
          "id": 17,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          }
        },
        {
          "type": "stat",
          "title": "validation-requests 유입",
          "description": "Session API가 검증 요청을 Kafka에 넣는지 확인한다.",
          "id": 18,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.001
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate{topic=\"validation-requests\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "validation-results 유입",
          "description": "validation-engine이 검증 결과를 Kafka에 넣는지 확인한다.",
          "id": 19,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.001
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate{topic=\"validation-results\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "validation DLQ 유입",
          "description": "처리 실패한 검증 요청이 DLQ로 빠지는지 확인한다.",
          "id": 20,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.001
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate{topic=\"validation-requests-dlq\"}) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "검증 consumer lag",
          "description": "validation-engine과 API 결과 소비가 밀리는지 확인한다.",
          "id": 21,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(kafka_consumergroup_lag{topic=\"validation-requests\",consumergroup=\"validation-engine\"}) or vector(0)",
              "legendFormat": "engine",
              "refId": "A"
            },
            {
              "expr": "sum(kafka_consumergroup_lag{topic=\"validation-results\",consumergroup=\"cledyu-api-validation-results\"}) or vector(0)",
              "legendFormat": "api",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation Kafka topic throughput",
          "id": 22,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (topic) (kafka_server_brokertopicmetrics_messagesinpersec_oneminuterate{topic=~\"validation-requests|validation-results|validation-requests-dlq\"})",
              "legendFormat": "{{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation Kafka consumer lag",
          "id": 23,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(kafka_consumergroup_lag{topic=\"validation-requests\",consumergroup=\"validation-engine\"})",
              "legendFormat": "validation-engine / validation-requests",
              "refId": "A"
            },
            {
              "expr": "sum(kafka_consumergroup_lag{topic=\"validation-results\",consumergroup=\"cledyu-api-validation-results\"})",
              "legendFormat": "api / validation-results",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation latency",
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 34
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, result) (increase(validation_duration_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, result) (increase(validation_duration_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p95",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AI hint latency",
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 34
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, result) (increase(ai_hint_latency_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, result) (increase(ai_hint_latency_seconds_bucket[15m])))",
              "legendFormat": "{{result}} p95",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Validation result throughput",
          "id": 13,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 42
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (result) (increase(validation_duration_seconds_count[15m]))",
              "legendFormat": "{{result}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AI hint result throughput",
          "id": 14,
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 42
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
