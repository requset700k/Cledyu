---
# CoreDNS ConfigMap — *.cledyu.local 와일드카드를 Traefik VIP (10.10.0.101) 로 응답.
# 이유:
#   모든 *.cledyu.local 서비스가 동일한 Traefik LoadBalancer VIP 로 들어가므로
#   호스트별 entry 가 필요 없음. template plugin 한 줄로 무한 와일드카드 처리.
#   신규 ingress 추가 시 본 ConfigMap 수정 불요.
#
# 외부 노출:
#   coredns-external Service (LoadBalancer, MetalLB 10.10.0.102) 가 동일 pod 를
#   selector 로 지목해 Tailscale 망의 팀 dev 머신에서도 직접 쿼리 가능.
#   (svc 정의: ./service-external.yaml)
#
# 적용:
#   kubectl apply -f infra/kubernetes/coredns/
#   kubectl -n kube-system rollout restart deployment coredns
#
# 주의:
#   kubeadm 이 install 시 자체 ConfigMap 을 만든 위에 덮어쓰는 형태.
#   Kubernetes upgrade 시 kubeadm 이 덮어쓸 수 있음 → upgrade 후 본 매니페스트 재적용 필수.

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        template IN A cledyu.local {
            match ^([a-zA-Z0-9_-]+\.)+cledyu\.local\.$
            answer "{{ .Name }} 60 IN A 10.10.0.101"
            fallthrough
        }
        # AAAA 는 authoritative NODATA(NOERROR-empty) 로 응답.
        # 이유: musl(getaddrinfo)·Go 순수 리졸버는 AAAA 에 NXDOMAIN 이 오면
        #   A 레코드가 있어도 이름 전체를 '없음'으로 판정 → dial "no such host".
        #   NODATA 로 답해야 dual-stack 리졸버가 A(10.10.0.101) 를 정상 사용.
        #   (glibc/getent 는 NXDOMAIN 에 관대해 증상이 안 보였음 — 오진 주의)
        template IN AAAA cledyu.local {
            match ^([a-zA-Z0-9_-]+\.)+cledyu\.local\.$
            rcode NOERROR
            fallthrough
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
