---
keycloak_foundation_namespace: keycloak
keycloak_foundation_name: cledyu-keycloak
keycloak_foundation_kubeconfig: /home/ubuntu/.kube/config
keycloak_foundation_manifest_path: /home/ubuntu/keycloak-foundation.yaml
keycloak_foundation_certificate_manifest_path: /home/ubuntu/keycloak-certificate.yaml
keycloak_foundation_ingress_manifest_path: /home/ubuntu/keycloak-ingress.yaml
keycloak_foundation_service_account_manifest_path: /home/ubuntu/keycloak-serviceaccount.yaml

keycloak_foundation_api_group: k8s.keycloak.org
keycloak_foundation_cr_version_preferred: v2
keycloak_foundation_cr_version_fallbacks:
  - v2beta1
  - v2alpha1
keycloak_foundation_cr_version_override: ""

keycloak_foundation_instances: 1
# CNPG 이관(Plan A-2 Task 4) cutover 반영 — 구 Bitnami(keycloak-db-postgresql)가 아닌
# CNPG rw 서비스를 가리킨다. 되돌리면 다음 플레이북 실행이 cutover 를 붕괴시키니 주의.
keycloak_foundation_db_service_name: keycloak-pg-rw
# CNPG 이관 후 자격증명은 ESO 관리 keycloak-pg-credentials(Vault cledyu/keycloak/postgres 소스,
# username/password 키)를 쓴다. 구 keycloak-db-credentials는 생성자(postgres_single role)가
# 플레이북에서 제거되어 고아 — 참조하지 말 것(값은 동일하나 재생성 주체 없음).
keycloak_foundation_db_secret_name: keycloak-pg-credentials
keycloak_foundation_service_name: "{{ keycloak_foundation_name }}-service"
keycloak_foundation_service_account_name: cledyu-keycloak
# Keycloak 서버 프론트엔드 hostname (Keycloak hostname v2).
# - 값이 있으면: 그 host 가 모든 realm 의 frontend URL(issuer·broker·redirect)에 고정된다.
#   이때 strict 는 사실상 무시된다(고정값이 항상 우선). 단일 공개 issuer 로 통일할 때 쓴다.
# - 빈 값("")이면: hostname 키를 생략해 동적 모드가 된다 — Keycloak 이 요청의
#   Host/X-Forwarded-Host(proxy.headers=xforwarded)로 URL 을 생성한다. 단일 Keycloak 으로
#   내부(keycloak.cledyu.local)와 공개(auth.cledyu.com)를 동시에 서빙하려면 이 모드 + strict=false.
# 기본값은 동적(빈 값 → hostname 키 생략 + strict=false): 내부(keycloak.cledyu.local)와
# 공개(auth.cledyu.com)를 요청별 올바른 issuer 로 서빙한다(2026-06-25 라이브 적용).
# 보안 전제(X-Forwarded-* 주입 차단)는 keycloak ingress 의 per-host 미들웨어로 영구
# 충족됨(infra/kubernetes/keycloak/ingress.yaml). 자세한 내용은 RUNBOOK §4.1.
keycloak_foundation_hostname: ""

# hostname strict 모드. 동적 모드(hostname="")에서는 반드시 false 여야 요청 Host 를 따른다.
# hostname 이 고정값이면 이 값과 무관하게 그 host 로 강제된다.
keycloak_foundation_hostname_strict: false

keycloak_foundation_tls_certificate_name: keycloak-tls
keycloak_foundation_tls_secret_name: keycloak-tls
keycloak_foundation_ingress_name: keycloak

# cledyu 커스텀 로그인 테마. 테마 파일(infra/keycloak-theme/cledyu/login)을 ConfigMap 으로
# 만들어 keycloak 파드 /opt/keycloak/themes/cledyu 에 마운트한다(커스텀 이미지 불필요).
# 빈 값이면 테마 미마운트(기본 테마). realm login_theme=cledyu 는 terraform 에서 설정.
keycloak_foundation_theme_configmap: cledyu-keycloak-theme
keycloak_foundation_theme_manifest_path: /home/ubuntu/keycloak-theme-configmap.yaml

# 네이버 소셜 로그인 SPI(keycloak/naver-idp). 네이버는 OIDC id_token 을 발급하지 않아
# 빌트인 oidc 프로바이더로 동작하지 않으므로, 커스텀 provider("naver") JAR 을 ConfigMap
# (binaryData)으로 만들어 /opt/keycloak/providers 에 마운트한다(테마와 동일 패턴, 커스텀
# 이미지 불필요). operator 가 비-optimized 로 기동→매 시작 시 augmentation 이 provider 등록.
# 빈 값이면 SPI 미마운트. JAR 은 dist/ 에 prebuilt 로 커밋(rebuild: README 참고).
keycloak_foundation_naver_spi_configmap: cledyu-keycloak-naver-spi
keycloak_foundation_naver_spi_jar_src: "{{ playbook_dir }}/../../keycloak/naver-idp/dist/naver-idp.jar"
